name: Issue 4 Rust Actix validation

on:
  push:
    branches:
      - feat/issue-4-rust-actix

permissions:
  contents: write

concurrency:
  group: issue-4-rust-actix-validation
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.1
          rustc --version
          cargo --version

      - name: Apply the Green implementation
        id: apply
        run: |
          python3 scripts/apply_issue4.py
          cargo generate-lockfile --manifest-path apps/rust-actix/Cargo.toml
          cargo fmt --manifest-path apps/rust-actix/Cargo.toml
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/rust-actix \
              docker-compose.yml \
              Makefile \
              tests/test_rust_actix_service.py
            git commit -m "feat: add the Rust Actix Web API implementation"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Rust formatting, tests, and lints
        if: steps.apply.outputs.changed == 'false'
        working-directory: apps/rust-actix
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate repository contracts
        if: steps.apply.outputs.changed == 'false'
        run: |
          python3 tests/test_database_environment.py --static
          python3 tests/test_go_gin_service.py --static
          python3 tests/test_rust_actix_service.py --static
          docker compose config
          git diff --check

      - name: Verify the shared database environment
        if: steps.apply.outputs.changed == 'false'
        run: make test-db

      - name: Verify the existing Go Gin service
        if: steps.apply.outputs.changed == 'false'
        run: make test-go-gin

      - name: Verify the Rust Actix Web service
        if: steps.apply.outputs.changed == 'false'
        run: make test-rust-actix

      - name: Verify final cleanup
        if: always() && steps.apply.outputs.changed == 'false'
        run: |
          make down
          docker compose ps -a
          test -z "$(docker compose ps -a --quiet)"
