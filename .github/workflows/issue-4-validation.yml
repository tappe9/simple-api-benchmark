name: Issue 4 Rust Actix validation

on:
  push:
    branches:
      - feat/issue-4-rust-actix

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.1
          rustc --version
          cargo --version

      - name: Generate the dependency lock file
        working-directory: apps/rust-actix
        run: cargo generate-lockfile

      - name: Commit the generated lock file
        run: |
          if ! git diff --quiet -- apps/rust-actix/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/rust-actix/Cargo.lock
            git commit -m "chore: lock Rust dependencies"
            git push
          fi

      - name: Run the failing Rust tests
        working-directory: apps/rust-actix
        run: cargo test --locked
