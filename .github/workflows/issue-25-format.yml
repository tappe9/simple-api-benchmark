name: Issue 25 formatter

on:
  push:
    branches: [issue-25-readme-charts]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: issue-25-readme-charts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - name: Install pinned formatter
        run: python -m pip install --require-hashes --only-binary=:all: -r apps/python-fastapi/requirements-dev.lock
      - name: Format changed Python
        run: |
          python -m ruff format --target-version py310 --config apps/python-fastapi/pyproject.toml \
            benchmark/generate_readme.py benchmark/publish.py benchmark/readme_charts.py \
            tests/test_benchmark_publication.py tests/test_benchmark_readme_charts.py
      - name: Commit and remove temporary formatter
        run: |
          git rm .github/workflows/issue-25-format.yml
          git add benchmark/generate_readme.py benchmark/publish.py benchmark/readme_charts.py \
            tests/test_benchmark_publication.py tests/test_benchmark_readme_charts.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format README chart changes'
          git push origin HEAD:issue-25-readme-charts
