name: Temporary formatting fix

on:
  push:
    branches:
      - issue-32-python-flask
    paths:
      - .github/workflows/format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: issue-32-python-flask
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
          check-latest: false
      - name: Apply exact CI Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r apps/python-fastapi/requirements-dev.lock
          python -m ruff format --target-version py310 --config apps/python-fastapi/pyproject.toml benchmark/environment.py tests/test_benchmark_python_flask_candidate.py
          python -m ruff format --diff --target-version py310 --config apps/python-fastapi/pyproject.toml benchmark tests/test_benchmark_*.py tests/test_compose_parity.py tests/test_contract_*.py tests/test_workflows.py tests/test_pages.py tests/test_site.py tests/registry_fixtures.py
          git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark/environment.py tests/test_benchmark_python_flask_candidate.py
          git commit -m 'style: apply CI formatting'
          git push origin HEAD:issue-32-python-flask
