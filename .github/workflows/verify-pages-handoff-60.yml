name: Verify Pages handoff post-merge
on:
  push:
    branches: [ops/verify-pages-handoff-60]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'tappe9/simple-api-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3da76bccd66ff56e04ab199ffec2f216f1b4bdc5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/node-fastify/.node-version
      - name: Verify exact source and unchanged measured results
        run: |
          test "$(git rev-parse HEAD)" = 3da76bccd66ff56e04ab199ffec2f216f1b4bdc5
          test "$(git rev-parse HEAD^{tree})" = 4f8e5c59b0d37f13e1baad4f1716a10a7c8bc1b1
          git diff --exit-code 25fa3f086919f7124afe3c8d22f0791bd83768ef HEAD -- results/
          mkdir -p "$RUNNER_TEMP/postmerge-evidence"
          git bundle create "$RUNNER_TEMP/postmerge-evidence/source.bundle" HEAD
      - name: Recheck isolated handoff contracts and actual browser regression suite
        run: |
          python -m unittest discover -s tests -p test_benchmark_pages_handoff.py -v
          python -O -m unittest discover -s tests -p test_benchmark_pages_handoff.py -v
          make test-site
          python -m benchmark.generate_readme --check
          git diff --exit-code
      - name: Compare all served public files with the exact merged-source build
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          evidence = Path(os.environ['RUNNER_TEMP']) / 'postmerge-evidence'
          source = '3da76bccd66ff56e04ab199ffec2f216f1b4bdc5'
          remote = subprocess.run(['git', 'ls-remote', 'origin', 'refs/heads/main'], check=True, capture_output=True, text=True, timeout=30)
          if remote.stdout.split()[0] != source:
              raise RuntimeError('main advanced; do not claim latest-main verification')
          subprocess.run(['python', '-m', 'benchmark.site'], check=True, timeout=60)
          built = root / '.cache/site'
          shutil.copytree(built, evidence / 'site')
          files = {}
          for path in sorted(built.rglob('*')):
              if not path.is_file():
                  continue
              name = path.relative_to(built).as_posix()
              if name == '.nojekyll':
                  continue
              expected = path.read_bytes()
              request = urllib.request.Request(
                  'https://tappe9.github.io/simple-api-benchmark/' + name,
                  headers={'Cache-Control': 'no-cache', 'User-Agent': 'simple-api-benchmark-postmerge-verifier'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = response.read(2 * 1024 * 1024 + 1)
                  if response.status != 200 or actual != expected:
                      raise RuntimeError('public file differs from verified build: ' + name)
                  files[name] = {'status': response.status, 'sha256': hashlib.sha256(actual).hexdigest()}
          report = json.loads((built / 'results/latest.json').read_bytes())
          measurements = sum(len(endpoint['runs']) for implementation in report['implementations'] for endpoint in implementation['endpoints'])
          if report['benchmark']['cohort'] != 'eight-stack-v1' or measurements != 72:
              raise RuntimeError('unexpected existing publication identity')
          manifest = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'checked_source': source,
              'checked_tree': '4f8e5c59b0d37f13e1baad4f1716a10a7c8bc1b1',
              'measurement_source': report['metadata']['source_commit'],
              'measurement_run': report['metadata']['github']['run_id'],
              'cohort': report['benchmark']['cohort'],
              'measurements': measurements,
              'served_files': files,
              'note': 'Read-only check of existing results; not an official producer-to-deployment live test.',
          }
          (evidence / 'verification.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pages-handoff-postmerge-${{ github.run_id }}
          path: ${{ runner.temp }}/postmerge-evidence/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
