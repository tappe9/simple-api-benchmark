name: Issue 25 format fix

on:
  push:
    branches:
      - issue-25-readme-charts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: issue-25-readme-charts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.16.5
      - run: python -m ruff format --target-version py310 --config apps/python-fastapi/pyproject.toml tests/test_benchmark_publication.py
      - run: |
          git rm .github/workflows/issue-25-fix-format.yml
          git add tests/test_benchmark_publication.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format publication test'
          git push origin HEAD:issue-25-readme-charts
