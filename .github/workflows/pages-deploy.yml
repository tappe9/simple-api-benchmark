name: Reusable Pages deployment
on:
  workflow_call:
    inputs:
      caller:
        type: string
        required: true
      target_sha:
        type: string
        required: true
      source_sha:
        type: string
        default: ''
      producer_run_id:
        type: string
        default: ''
      producer_run_attempt:
        type: string
        default: ''
      producer_result:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.repository == 'tappe9/simple-api-benchmark' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PAGES_CALLER: ${{ inputs.caller }}
      PAGES_TARGET_SHA: ${{ inputs.target_sha }}
      PAGES_SOURCE_SHA: ${{ inputs.source_sha }}
      PAGES_PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
      PAGES_PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
      PAGES_PRODUCER_RESULT: ${{ inputs.producer_result }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - name: Authorize caller and build exact current-main content
        id: build
        run: python -m benchmark.pages_handoff build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .cache/pages-source/.cache/site
          name: ${{ steps.build.outputs.artifact_name }}
  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PAGES_CALLER: ${{ inputs.caller }}
      PAGES_TARGET_SHA: ${{ inputs.target_sha }}
      PAGES_SOURCE_SHA: ${{ inputs.source_sha }}
      PAGES_PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
      PAGES_PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
      PAGES_PRODUCER_RESULT: ${{ inputs.producer_result }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - name: Reject stale or mismatched content inside the deployment lock
        run: python -m benchmark.pages_handoff verify
      - name: Deploy only this verified build artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
