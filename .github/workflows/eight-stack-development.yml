name: Eight-stack development
on:
  push:
    branches: [feat/eight-stack-cohort]
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'tappe9/simple-api-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Export exact development source for offline verification
        run: git bundle create "$RUNNER_TEMP/source.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eight-stack-source-${{ github.run_id }}
          path: ${{ runner.temp }}/source.bundle
          retention-days: 1
          if-no-files-found: error
      - name: Verify unchanged baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" 27fb16aeb333b56c03974dc3ad31237cdcc4896c
          cd "$RUNNER_TEMP/baseline"
          make test-registry test-benchmark
      - name: Expose missing real eight-stack cohort before implementation
        run: python -m unittest discover -s tests -p test_benchmark_eight_stack.py -v
