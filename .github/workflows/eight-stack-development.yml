name: Eight-stack development
on:
  push:
    branches: [feat/eight-stack-cohort]
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'tappe9/simple-api-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Export source and hash-verified formatting tool for offline verification
        run: |
          mkdir -p "$RUNNER_TEMP/eight-stack-tools"
          git bundle create "$RUNNER_TEMP/eight-stack-tools/source.bundle" HEAD refs/remotes/origin/main
          grep '^ruff==' apps/python-fastapi/requirements-dev.lock > "$RUNNER_TEMP/ruff.lock"
          python -m pip download --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/ruff.lock" --dest "$RUNNER_TEMP/eight-stack-tools"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eight-stack-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/eight-stack-tools/
          retention-days: 1
          if-no-files-found: error
      - name: Expose missing real eight-stack cohort before implementation
        run: python -m unittest discover -s tests -p test_benchmark_eight_stack.py -v
