name: Issue 25 generated assets

on:
  push:
    branches: [issue-25-readme-charts]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: issue-25-readme-charts
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Update publication expectation and move results first
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('tests/test_benchmark_publication.py')
          text = test.read_text()
          old = '''        self.assertEqual(
              set(changed), {"README.md", "README.ja.md", "results/latest.json", *history}
          )'''.replace('              ', '            ')
          new = '''        charts = {
              "results/charts/json-throughput.svg",
              "results/charts/postgresql-throughput.svg",
              "results/charts/cpu-throughput.svg",
          }
          self.assertEqual(
              set(changed), {"README.md", "README.ja.md", "results/latest.json", *history, *charts}
          )'''.replace('              ', '            ')
          if text.count(old) != 1:
              raise SystemExit('publication expectation pattern did not match exactly once')
          test.write_text(text.replace(old, new))

          def move_results(path, heading, anchor):
              file = Path(path)
              source = file.read_text()
              start_token = heading + '\n\n<!-- benchmark-results:start -->'
              start = source.index(start_token)
              end_token = '<!-- benchmark-results:end -->'
              end = source.index(end_token, start) + len(end_token)
              while end < len(source) and source[end] == '\n':
                  end += 1
              block = source[start:end].rstrip() + '\n\n'
              source = source[:start] + source[end:]
              position = source.index(anchor)
              file.write_text(source[:position] + block + source[position:])

          move_results('README.md', '## Results', '## What is compared?')
          move_results('README.ja.md', '## 結果', '## 比較対象')
          PY
      - name: Generate README sections and SVGs
        run: python -m benchmark.generate_readme
      - name: Remove temporary workflow and commit generated assets
        run: |
          git rm .github/workflows/issue-25-generate.yml
          git add README.md README.ja.md results/charts tests/test_benchmark_publication.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: generate README benchmark charts'
          git push origin HEAD:issue-25-readme-charts
