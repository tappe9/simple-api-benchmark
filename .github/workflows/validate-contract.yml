name: Validate shared contract
on:
  push:
    branches: [test/issue-7-shared-contract]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.7
      - name: Install hash-verified existing development tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r apps/python-fastapi/requirements-dev.lock
          cp "$(command -v ruff)" "$RUNNER_TEMP/ruff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-format-tool
          path: ${{ runner.temp }}/ruff
          retention-days: 1
