name: Validate shared contract
on:
  push:
    branches: [test/issue-7-shared-contract]
permissions:
  contents: read
concurrency:
  group: validate-issue-7
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: contract-validation-${{ github.run_id }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source tree and scope
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/review-index"
          git read-tree HEAD
          git update-index --force-remove .github/workflows/validate-contract.yml
          actual="$(git write-tree)"
          echo "Source tree without temporary validation workflow: $actual"
          test "$actual" = 4b361fd517307fb064b253d0a6012c2e5eb2289b
          unset GIT_INDEX_FILE
          git diff --exit-code 8bde2b343507f5264274e1469d45037de57b5b6e HEAD -- apps database docker-compose.yml
          git diff --check 8bde2b343507f5264274e1469d45037de57b5b6e HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Python 3.10 shared suite compatibility
        run: python -m unittest discover -s tests -p 'test_contract_*.py' -v
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.7
      - name: Install existing hash-locked quality tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r apps/python-fastapi/requirements-dev.lock
      - name: Shared source lint and format
        run: |
          python -m ruff check --no-cache --target-version py310 --config apps/python-fastapi/pyproject.toml benchmark tests/test_contract_*.py
          python -m ruff format --no-cache --target-version py310 --check --config apps/python-fastapi/pyproject.toml benchmark tests/test_contract_*.py
      - name: Reproduce behavioral Red with disabled assertions
        run: |
          python - <<'PY'
          import io
          import unittest
          from unittest.mock import patch
          from benchmark import contract_test
          tests = unittest.defaultTestLoader.discover('tests', pattern='test_contract_assertions.py')
          output = io.StringIO()
          with patch.object(contract_test, 'assert_response', return_value=None):
              result = unittest.TextTestRunner(stream=output).run(tests)
          print(f'Negative control: {result.testsRun} tests; {len(result.failures)} expected failures; {len(result.errors)} errors')
          if result.testsRun != 11 or len(result.failures) != 54 or result.errors:
              raise SystemExit(output.getvalue())
          print('Incorrect responses are detected by the assertion tests, not by missing imports or files.')
          PY
      - name: Python 3.14 optimized shared suite
        run: python -O -m unittest discover -s tests -p 'test_contract_*.py' -v
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.1
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Shared PostgreSQL regression
        run: make test-db
      - name: Go Gin regression
        run: make test-go-gin
      - name: Rust Actix regression
        run: make test-rust-actix
      - name: Node Fastify regression
        run: make test-node-fastify
      - name: Python FastAPI regression
        run: make test-python-fastapi
      - name: All four shared contracts sequentially
        run: make test-contract
      - name: Real contract failure cleanup
        run: |
          python - <<'PY'
          import subprocess
          import uuid
          from unittest.mock import patch
          from benchmark import contract_runner as runner
          from benchmark import contract_test as contract
          token = uuid.uuid4()
          project = 'sab-contract-' + token.hex[:12]
          real_read = contract.read_response
          def corrupt(base_url, path, *, timeout):
              response = real_read(base_url, path, timeout=timeout)
              if path == '/json':
                  return contract.Response(response.status, response.content_type,
                      b'{"message":"Hello, World!","items":[true,2,3,4,5]}')
              return response
          with patch.object(runner.uuid, 'uuid4', return_value=token), patch.object(contract, 'read_response', side_effect=corrupt):
              try:
                  runner.run_implementations(('go-gin',))
              except contract.ContractFailure as error:
                  print(f'Expected contract rejection: {error}')
                  if '[go-gin] GET /json:' not in str(error) or 'items[0] type' not in str(error):
                      raise
              else:
                  raise SystemExit('Incorrect JSON was accepted')
          for arguments in (['ps', '-aq'], ['network', 'ls', '-q'], ['volume', 'ls', '-q']):
              remaining = subprocess.check_output(['docker', *arguments, '--filter',
                  'label=com.docker.compose.project=' + project], text=True).strip()
              if remaining:
                  raise SystemExit(f'Leaked resources for {project}: {remaining}')
          print('Actual assertion failure left zero containers, networks, or volumes.')
          PY
      - name: Source integrity after validation
        run: |
          git diff --exit-code
          git diff --check 8bde2b343507f5264274e1469d45037de57b5b6e HEAD
      - name: Final cleanup and leak check
        if: always()
        run: |
          set -euo pipefail
          make down
          test -z "$(docker ps -aq --filter label=com.docker.compose.project)"
          test -z "$(docker network ls -q --filter label=com.docker.compose.project)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project)"
