name: Issue 3 Go Gin validation

on:
  push:
    branches:
      - feat/issue-3-go-gin

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the branch
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache-dependency-path: apps/go-gin/go.sum

      - name: Resolve Go dependencies
        working-directory: apps/go-gin
        run: go mod tidy

      - name: Commit generated module sums
        run: |
          if ! git diff --quiet -- apps/go-gin/go.mod apps/go-gin/go.sum; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/go-gin/go.mod apps/go-gin/go.sum
            git commit -m "chore: resolve Go dependencies"
            git push
          fi

      - name: Run the failing Go tests
        working-directory: apps/go-gin
        run: go test ./...
