name: Verify Pages release separation
on:
  push:
    branches: [ops/verify-pages-release-53]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET_SHA: 51b16dc797f2c061bb6a4fdbb9ae74b67d3b89b6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 51b16dc797f2c061bb6a4fdbb9ae74b67d3b89b6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Recheck exact merged workflow contracts
        run: |
          python -m pip install --only-binary=:all: PyYAML==6.0.3
          mkdir -p .cache/release-separation-evidence
          python -m unittest discover -s tests -p test_workflows.py -v > .cache/release-separation-evidence/workflows.log 2>&1
          python -O -m unittest discover -s tests -p test_workflows.py -v > .cache/release-separation-evidence/workflows-optimized.log 2>&1
          make test-registry
          python -m benchmark.generate_readme --check
          python -m benchmark.site
      - name: Verify main CI, release-free Pages and unchanged public bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import time
          import urllib.request
          from pathlib import Path

          REPO = "tappe9/simple-api-benchmark"
          TARGET = os.environ["TARGET_SHA"]
          BASE = "e9661814712eb76b9a8308c2f368a29cc6529fef"
          TREE = "03ab02ae2a9a1164d72f1fc253694615e4a053a4"
          OUT = Path(".cache/release-separation-evidence")
          OUT.mkdir(parents=True, exist_ok=True)

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{REPO}/{path}"], timeout=40))

          def save(name, value):
              (OUT / name).write_text(json.dumps(value, indent=2) + "\n")

          def current_main():
              require(api("git/ref/heads/main")["object"]["sha"] == TARGET, "main advanced")

          def completed_run(filename, event, deadline, not_before=""):
              while time.monotonic() < deadline:
                  current_main()
                  runs = api(f"actions/workflows/{filename}/runs?head_sha={TARGET}&event={event}&per_page=10")["workflow_runs"]
                  runs = [r for r in runs if r["created_at"] >= not_before]
                  if runs:
                      run = runs[0]
                      require(run["head_sha"] == TARGET and run["head_branch"] == "main", "wrong run source")
                      if run["status"] == "completed":
                          require(run["conclusion"] == "success", f"{filename} did not succeed")
                          return run
                  time.sleep(15)
              raise RuntimeError(f"deadline waiting for {filename}")

          require(bool(re.fullmatch("[0-9a-f]{40}", TARGET)), "invalid merge SHA")
          require(git("rev-parse", "HEAD") == TARGET, "checkout is not the merge")
          require(git("rev-parse", "HEAD^{tree}") == TREE, "merge tree differs from reviewed tree")
          require(not git("diff", BASE, "HEAD", "--", "results", "site", "apps", "benchmark", "docker-compose.yml", "Makefile", ".github/workflows/ci.yml", ".github/workflows/benchmark.yml", ".github/workflows/pages-deploy.yml"), "out-of-scope change")
          for filename in ("README.md", "README.ja.md"):
              old = subprocess.check_output(["git", "show", f"{BASE}:{filename}"])
              new = Path(filename).read_bytes()
              pattern = rb"<!-- benchmark-results:start -->.*?<!-- benchmark-results:end -->"
              require(re.search(pattern, old, re.S).group() == re.search(pattern, new, re.S).group(), "generated result changed")
          current_main()
          deadline = time.monotonic() + 720
          ci = completed_run("ci.yml", "push", deadline)
          pages = completed_run("pages.yml", "workflow_run", deadline, ci["updated_at"])
          registry = json.loads(Path("benchmark/implementations.json").read_text())
          ci_names = {"plan", "shared", "smoke", "required"} | {f"implementation ({s['id']})" for s in registry["implementations"]}
          for label, run, expected in (("ci", ci, ci_names), ("pages", pages, {"deploy / build", "deploy / deploy"})):
              payload = api(f"actions/runs/{run['id']}/jobs?per_page=100")
              jobs = payload["jobs"]
              require(payload["total_count"] == len(jobs) == len(expected), "incomplete jobs")
              require({j["name"] for j in jobs} == expected, "unexpected jobs or release job")
              require(all(j["status"] == "completed" and j["conclusion"] == "success" for j in jobs), "unsuccessful required job")
              save(f"{label}-run.json", run)
              save(f"{label}-jobs.json", payload)
          save("pages-artifacts.json", api(f"actions/runs/{pages['id']}/artifacts?per_page=100"))
          release = api("releases/tags/v0.1.0")
          tag = api("git/ref/tags/v0.1.0")
          expected_release = {
              "id": 384397012, "tag_name": "v0.1.0", "name": "v0.1.0",
              "target_commitish": "962e1454e51d60d4e24cddd9126e4d6b35b80716",
              "created_at": "2026-09-08T01:31:15Z", "updated_at": "2026-09-08T01:47:51Z",
              "published_at": "2026-09-08T01:47:51Z", "draft": False, "prerelease": False, "assets": [],
              "body": "First release of Simple API Benchmark with four comparable API stacks, a shared contract suite, the fixed v0.1 benchmark runner, trusted-main official results, and the GitHub Pages result view.\n\nKnown limitation: GitHub-hosted runners are shared infrastructure, so hardware and background load can vary between runs. Comparisons within one complete run are more meaningful than small differences across dates. Results compare complete API stacks, not programming languages in isolation.",
          }
          require({k: release[k] for k in expected_release} == expected_release, "existing release changed")
          require(tag["object"]["sha"] == expected_release["target_commitish"] and tag["object"]["type"] == "commit", "tag changed")
          save("release.json", release)
          save("tag.json", tag)
          site = Path(".cache/site")
          observations = []
          for path in sorted(site.rglob("*")):
              if not path.is_file() or path.name == ".nojekyll":
                  continue
              relative = path.relative_to(site).as_posix()
              url = "https://tappe9.github.io/simple-api-benchmark/" + relative
              with urllib.request.urlopen(url, timeout=30) as response:
                  actual = response.read(4 * 1024 * 1024)
                  require(response.status == 200, "non-200 public file")
              require(actual == path.read_bytes(), "public bytes differ: " + relative)
              observations.append({"path": relative, "status": 200, "bytes": len(actual), "sha256": hashlib.sha256(actual).hexdigest()})
          require(len(observations) == 9, "unexpected public file count")
          shutil.copytree(site, OUT / "site", dirs_exist_ok=True)
          current_main()
          require(not git("status", "--porcelain"), "tracked or untracked source changed")
          summary = {"checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "merge_sha": TARGET, "tree": TREE, "ci_run": ci["id"], "pages_run": pages["id"], "release_unchanged": True, "tag_unchanged": True, "public_files": observations}
          save("summary.json", summary)
          subprocess.run(["git", "bundle", "create", str(OUT / "source.bundle"), "HEAD"], check=True)
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-separation-postmerge
          path: .cache/release-separation-evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
