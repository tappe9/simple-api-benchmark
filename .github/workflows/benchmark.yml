name: Official benchmark
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-benchmark
  cancel-in-progress: false
jobs:
  measure:
    if: >-
      github.repository == 'tappe9/simple-api-benchmark' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - name: Full fixed profile, all four APIs sequentially
        run: python -m benchmark.official
      - name: Retain raw diagnostics and complete selected JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/official/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: measure
    if: >-
      needs.measure.result == 'success' &&
      github.repository == 'tappe9/simple-api-benchmark' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: official-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/official/
      - name: Audit and atomically publish results without overwriting newer main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m benchmark.publish
