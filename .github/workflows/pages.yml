name: Pages
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: >-
      github.repository == 'tappe9/simple-api-benchmark' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.status == 'completed' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.name == 'CI' &&
          github.event.workflow_run.path == '.github/workflows/ci.yml' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_sha == github.sha
        )
      )
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-deploy.yml
    with:
      caller: pages
      target_sha: ${{ github.sha }}
  release:
    needs: deploy
    if: >-
      github.repository == 'tappe9/simple-api-benchmark' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish v0.1.0 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 already exists; leaving it unchanged."
            exit 0
          fi
          notes=$(cat <<'EOF'
          First release of Simple API Benchmark with four comparable API stacks, a shared contract suite, the fixed v0.1 benchmark runner, trusted-main official results, and the GitHub Pages result view.

          Known limitation: GitHub-hosted runners are shared infrastructure, so hardware and background load can vary between runs. Comparisons within one complete run are more meaningful than small differences across dates. Results compare complete API stacks, not programming languages in isolation.
          EOF
          )
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.1.0" \
            --notes "$notes"
