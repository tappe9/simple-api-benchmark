name: Activation development
on:
  push:
    branches: [feat/activate-eight-stack-cohort]
permissions:
  contents: write
jobs:
  verify:
    if: >-
      github.repository == 'tappe9/simple-api-benchmark' &&
      github.ref == 'refs/heads/feat/activate-eight-stack-cohort' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Apply the exact reviewed change after proving the regression
        run: |
          set -euo pipefail
          base=1fa233a777915039cf2f3f8baab76137d0e2f4dd
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-parse origin/main)" = "$base"
          cp .github/activation.patch "$RUNNER_TEMP/activation.patch"
          echo '2f8a3b71fe49ee57d164b40d7fedaef48e110a82555d6ea361a9368a7bc04d9a  '"$RUNNER_TEMP/activation.patch" | sha256sum --check
          rm .github/activation.patch .github/workflows/activation-development.yml
          git apply --unidiff-zero --include=tests/test_benchmark_eight_stack.py "$RUNNER_TEMP/activation.patch"
          status=0
          python -m unittest discover -s tests -p test_benchmark_eight_stack.py -v > "$RUNNER_TEMP/red.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/red.log"
          test "$status" -eq 1
          grep -F 'Ran 15 tests' "$RUNNER_TEMP/red.log"
          grep -F 'FAILED (failures=2)' "$RUNNER_TEMP/red.log"
          git apply --unidiff-zero --exclude=tests/test_benchmark_eight_stack.py "$RUNNER_TEMP/activation.patch"
          python -m unittest discover -s tests -p test_benchmark_eight_stack.py -v
          python -m benchmark.registry --check
          python -m benchmark.generate_readme --check
          git diff --exit-code "$base" -- apps results docker-compose.yml benchmark/config.json benchmark/definition.py .github/workflows
          git diff --check
          git add -A
          test "$(git write-tree)" = 0bea2fc03383cba99688523a68367a28836d408e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: activate the versioned eight-stack benchmark cohort' -m 'Use the approved eight-stack cohort for new runs while preserving historical reports and all execution settings. Add default-path activation coverage and align documentation. Refs #50.'
      - name: Push only the verified activation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 0bea2fc03383cba99688523a68367a28836d408e
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$header" \
            git push origin HEAD:refs/heads/feat/activate-eight-stack-cohort
          git bundle create "$RUNNER_TEMP/activation-ready.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: activation-ready-${{ github.run_id }}
          path: ${{ runner.temp }}/activation-ready.bundle
          retention-days: 1
          if-no-files-found: error
