name: Temporary shared-order diagnostic
on:
  push:
    branches: [fix/flask-gunicorn-70]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: make test-benchmark
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - run: python -m pip install --require-hashes --only-binary=:all: -r apps/python-fastapi/requirements-dev.lock
      - run: make test-registry
      - run: |
          mkdir -p .cache/diag
          python -m unittest discover -s tests -p 'test_site.py' -v > .cache/diag/site.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-order-diagnostic
          path: .cache/diag/site.log
          retention-days: 1
