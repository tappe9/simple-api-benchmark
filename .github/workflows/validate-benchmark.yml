name: Validate benchmark runner
on:
  push:
    branches: [feat/issue-8-benchmark-runner]
permissions:
  contents: read
concurrency:
  group: validate-issue-8
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COMPOSE_PROJECT_NAME: issue8-validation-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and unchanged API baseline
        run: |
          set -euo pipefail
          mkdir -p .cache/validation
          git diff --check 2efa06999d67c2f64e0b4f734419f50710ae3c21 HEAD
          git diff --exit-code 2efa06999d67c2f64e0b4f734419f50710ae3c21 HEAD -- apps database docker-compose.yml benchmark/contract_test.py benchmark/contract_runner.py 'tests/test_contract_*.py'
          index="$RUNNER_TEMP/verification-index"
          GIT_INDEX_FILE="$index" git read-tree HEAD
          GIT_INDEX_FILE="$index" git update-index --force-remove .github/workflows/validate-benchmark.yml
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          test "$tree" = 2a7d9c294023b584292a286355a4b96fdf3296c7
          printf '%s\n' "$GITHUB_SHA" "$tree" | tee .cache/validation/source.txt
          git bundle create .cache/validation/source.bundle --all
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Python 3.10 focused compatibility
        run: |
          make test-benchmark
          python -m unittest discover -s tests -p 'test_contract_*.py' -v
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - name: Focused tests and existing hash-locked lint tool
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r apps/python-fastapi/requirements-dev.lock
          python -m ruff check --target-version py310 --config apps/python-fastapi/pyproject.toml benchmark tests/test_benchmark_*.py tests/test_contract_*.py
          python -m ruff format --check --target-version py310 --config apps/python-fastapi/pyproject.toml benchmark tests/test_benchmark_*.py tests/test_contract_*.py
          make test-benchmark
          python -O -m unittest discover -s tests -p 'test_benchmark_*.py' -v
      - name: Behavioral negative controls detect broken implementations
        run: |
          python - <<'PY' | tee .cache/validation/negative-controls.log
          import io, sys, unittest
          from unittest.mock import patch
          sys.path.insert(0, 'tests')
          import test_benchmark_results as parsers
          import test_benchmark_runner as runners
          from benchmark import results, run
          original = run.run_benchmark
          def bypass_contract(env, *args, **kwargs):
              def bypass(*args, **kwargs):
                  env.contract_seen = True
                  return 14
              kwargs['contract'] = bypass
              return original(env, *args, **kwargs)
          controls = [
              ('accept corrupted metrics', patch.object(results, 'parse_oha', return_value={}), parsers.ParserTests('test_wrong_counts_units_and_consistency_are_rejected')),
              ('select the first run', patch.object(results, 'select_run', side_effect=lambda runs: runs[0]), parsers.SelectionTests('test_selects_middle_throughput_with_all_metrics_from_that_run')),
              ('skip shared contract', patch.object(run, 'run_benchmark', side_effect=bypass_contract), runners.RunnerTests('test_actual_contract_exception_prevents_all_load')),
              ('omit resource cleanup', patch.object(runners.Environment, 'cleanup', return_value=None), runners.RunnerTests('test_all_failures_cleanup_protect_existing_result_and_stop')),
          ]
          for name, mutation, case in controls:
              stream = io.StringIO()
              with mutation:
                  result = unittest.TextTestRunner(stream=stream, verbosity=2).run(unittest.TestSuite([case]))
              print(name, 'failures:', len(result.failures), 'errors:', len(result.errors))
              print(stream.getvalue())
              assert result.failures and not result.errors, name
          print('All four deliberately broken behaviors were detected; these are not benchmark results.')
          PY
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Existing Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: make test-db
        run: make test-db
      - name: make test-go-gin
        run: make test-go-gin
      - name: make test-rust-actix
        run: make test-rust-actix
      - name: make test-node-fastify
        run: make test-node-fastify
      - name: make test-python-fastapi
        run: make test-python-fastapi
      - name: make test-contract
        run: make test-contract
      - name: Full documented benchmark - 36 measured runs, no retries
        run: make benchmark
      - name: Independently audit all raw measurements and selected runs
        run: |
          python - <<'PY' | tee .cache/validation/full-result-audit.log
          import json, os
          from pathlib import Path
          from benchmark.results import parse_oha, select_run
          from benchmark.run import IMPLEMENTATIONS, PROFILE
          data = json.loads(Path('results/latest.json').read_text())
          assert data['metadata']['source_commit'] == os.environ['GITHUB_SHA']
          assert data['conditions'] == PROFILE and data['mode'] == 'local' and data['official'] is False
          assert data['status'] == 'verified'
          assert [b['implementation'] for b in data['implementations']] == list(IMPLEMENTATIONS)
          root = Path(data['metadata']['artifact_directory'])
          measured = 0
          rows = ['| API | Endpoint | Selected run | Requests/s | Mean ms | Observed peak MiB |', '| --- | --- | ---: | ---: | ---: | ---: |']
          for backend in data['implementations']:
              assert backend['contract_checks'] == 14
              assert [e['endpoint'] for e in backend['endpoints']] == PROFILE['endpoints']
              for endpoint in backend['endpoints']:
                  assert len(endpoint['runs']) == 3
                  assert endpoint['selected'] == select_run(endpoint['runs'])
                  stem = backend['implementation'] + '-' + endpoint['endpoint'].strip('/').replace('/', '-')
                  for entry in endpoint['runs']:
                      path = root / f"{stem}-run-{entry['run']}.json"
                      raw = parse_oha(path.read_bytes(), duration=30)
                      assert all(entry[key] == value for key, value in raw.items())
                      samples = [json.loads(line) for line in path.with_suffix('.memory.jsonl').read_text().splitlines()]
                      assert len(samples) == entry['memory_samples']
                      assert all(s['container_id'] == backend['container']['id'] for s in samples)
                      assert max(s['bytes'] for s in samples) == entry['peak_memory_bytes']
                      measured += 1
                  e = endpoint['selected']
                  rows.append(f"| {backend['implementation']} | {endpoint['endpoint']} | {e['run']} | {e['requests_per_second']:.3f} | {e['mean_response_time_ms']:.6f} | {e['peak_memory_bytes'] / 1048576:.3f} |")
          assert measured == 36
          print('All 36 full-profile runs independently matched raw oha and API memory samples. Not an official published result.')
          table = '\n'.join(rows) + '\n'
          print(table)
          Path('.cache/validation/results-table.md').write_text(table)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Full-profile development validation (not official results)\n' + table)
          PY
      - name: Real short smoke cannot replace verified full results
        run: |
          set -euo pipefail
          sha256sum results/latest.json > .cache/validation/latest.sha256
          make benchmark-smoke
          sha256sum --check .cache/validation/latest.sha256
      - name: Live contract and metric failures preserve results and clean resources
        run: |
          python - <<'PY' | tee .cache/validation/live-failure-controls.log
          from pathlib import Path
          from unittest.mock import patch
          from benchmark import environment, run
          from benchmark.contract_test import ContractFailure
          from benchmark.install_oha import ensure_oha
          from benchmark.results import BenchmarkFailure
          latest = Path('results/latest.json')
          original = latest.read_bytes()
          oha = ensure_oha()
          for failure in ('contract', 'memory'):
              env = environment.DockerEnvironment(oha, Path('.cache/benchmark'))
              if failure == 'contract':
                  control = patch.object(run, 'run_contract', side_effect=ContractFailure('injected shared contract failure on live API'))
              else:
                  control = patch.object(environment, 'memory_bytes', side_effect=BenchmarkFailure('injected memory collection failure'))
              with control, patch.object(env, 'measure', wraps=env.measure) as load:
                  try:
                      run.run_benchmark(env, run.load_config(), latest, metadata={'test': 'live failure control'})
                  except BenchmarkFailure as error:
                      assert failure in str(error), str(error)
                      print('Expected live', failure, 'failure:', error)
                  else:
                      raise AssertionError('failure was not propagated')
                  if failure == 'contract':
                      load.assert_not_called()
              assert env.container is None
              assert latest.read_bytes() == original
              print('Verified owned-resource cleanup and byte-for-byte preservation:', failure)
          PY
      - name: Verify no source mutation
        run: |
          git diff --exit-code HEAD
          git diff --check 2efa06999d67c2f64e0b4f734419f50710ae3c21 HEAD
      - name: Clean only the validation job's default Compose project
        if: always()
        run: timeout 90 docker compose -p "$COMPOSE_PROJECT_NAME" down --remove-orphans --volumes --timeout 10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-8-validation
          path: |
            results/latest.json
            .cache/benchmark/
            .cache/validation/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
