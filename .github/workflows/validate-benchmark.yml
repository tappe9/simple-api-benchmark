name: Validate benchmark runner
on:
  push:
    branches: [feat/issue-8-benchmark-runner]
permissions:
  contents: read
concurrency:
  group: validate-issue-8
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Obtain the already pinned quality tool without changing dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          grep '^ruff==' apps/python-fastapi/requirements-dev.lock > "$RUNNER_TEMP/ruff.lock"
          python3 -m venv "$RUNNER_TEMP/quality"
          "$RUNNER_TEMP/quality/bin/python" -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/ruff.lock"
          cp "$RUNNER_TEMP/quality/bin/ruff" "$RUNNER_TEMP/tools/ruff"
          "$RUNNER_TEMP/tools/ruff" --version
          git bundle create "$RUNNER_TEMP/tools/repository.bundle" --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-quality-tools
          path: ${{ runner.temp }}/tools/
          retention-days: 7
          if-no-files-found: error
