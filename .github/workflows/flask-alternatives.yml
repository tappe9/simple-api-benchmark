name: Disposable Flask alternatives screening
on:
  push:
    branches: [investigate/flask-alternatives-70]
    paths: [.github/workflows/flask-alternatives.yml]
permissions:
  contents: read
concurrency:
  group: flask-alternatives-screening
  cancel-in-progress: false
jobs:
  screen:
    if: github.repository == 'tappe9/simple-api-benchmark' && github.ref == 'refs/heads/investigate/flask-alternatives-70'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - name: Write disposable probe into ignored cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/flask-alternatives
          cat > .cache/flask-alternatives/probe.py <<'PY_PROBE'
          """Disposable screening helpers; not a production benchmark implementation."""
          import unittest


          def validate_process_snapshot(text, gunicorn=False, expected=None):
              rows = [line.split(None, 2) for line in text.strip().splitlines()[1:]]
              if len(rows) != (2 if gunicorn else 1):
                  raise ValueError("unexpected server process count")
              if any(len(row) != 3 or not row[0].isdigit() or not row[1].isdigit() for row in rows):
                  raise ValueError("invalid process evidence")
              pids = tuple(sorted(int(row[0]) for row in rows))
              if gunicorn:
                  if not all("gunicorn" in row[2] for row in rows):
                      raise ValueError("unrelated process in Gunicorn container")
                  if sum(int(row[1]) in pids for row in rows) != 1:
                      raise ValueError("expected one arbiter and its one worker")
              if expected is not None and pids != expected:
                  raise ValueError("server process replaced during cell")
              return pids


          class SafetyTests(unittest.TestCase):
              def test_one_process(self):
                  self.assertEqual(validate_process_snapshot('PID PPID COMMAND\n12 1 python -m uvicorn'), (12,))

              def test_gunicorn_parent_and_one_worker(self):
                  self.assertEqual(validate_process_snapshot('PID PPID COMMAND\n12 1 python -m gunicorn\n13 12 python -m gunicorn', True), (12, 13))

              def test_rejects_extra_worker(self):
                  with self.assertRaises(ValueError):
                      validate_process_snapshot('PID PPID COMMAND\n12 1 python -m gunicorn\n13 12 python -m gunicorn\n14 12 python -m gunicorn', True)

              def test_rejects_worker_replacement(self):
                  with self.assertRaises(ValueError):
                      validate_process_snapshot('PID PPID COMMAND\n12 1 python -m gunicorn\n14 12 python -m gunicorn', True, (12, 13))

              def test_rejects_unrelated_process(self):
                  with self.assertRaises(ValueError):
                      validate_process_snapshot('PID PPID COMMAND\n12 1 python -m gunicorn\n13 1 bash', True)

              def test_rejects_missing_processes(self):
                  with self.assertRaises(ValueError):
                      validate_process_snapshot('PID PPID COMMAND', False)




          def main():
              import atexit
              import hashlib
              import http.client
              import json
              import os
              import platform
              import signal
              import sys
              import traceback
              from pathlib import Path
              from benchmark.contract_runner import protect_cleanup
              from benchmark.contract_test import load_cases, run_contract
              from benchmark.environment import DockerEnvironment, provenance, validate_state
              from benchmark.healthcheck import EXTERNAL_READINESS, wait_external_readiness
              from benchmark.install_oha import ensure_oha
              from benchmark.process import ROOT, execute
              from benchmark.results import atomic_json, require, select_run, strict_json, validate_run

              require(os.environ.get('GITHUB_REF') == 'refs/heads/investigate/flask-alternatives-70', 'experiment branch required')
              base = '9b92c74cba34bd5a4bfc389075b9bef135131034'
              require(execute(['git', 'rev-parse', 'HEAD^'], timeout=10).strip() == base, 'unexpected experiment base')
              changed = execute(['git', 'diff', '--name-only', base, 'HEAD'], timeout=10).splitlines()
              require(changed == ['.github/workflows/flask-alternatives.yml'], 'unexpected source modifications')
              out = ROOT / '.cache' / 'flask-alternatives'
              require(not (out / 'diagnostic.json').exists(), 'refuse replacement output')
              out.mkdir(parents=True, exist_ok=True)
              payload = out / 'payload'
              payload.mkdir(exist_ok=True)
              arms = ['waitress-baseline', 'waitress-select', 'gunicorn-gthread', 'gunicorn-sync', 'starlette', 'fastapi-control']
              plan = [dict(block=b, arm=a, endpoints=['/json', '/db/42'] if b == 1 else ['/db/42', '/json'])
                      for b, order in [(1, arms), (2, list(reversed(arms)))] for a in order]
              atomic_json(out / 'plan.json', {'official': False, 'publishable': False, 'plan': plan,
                  'conditions': {'cpu_quota': 1, 'memory_bytes': 536870912, 'connections': 50,
                  'warmup_seconds': 5, 'duration_seconds': 5, 'runs': 3, 'affinity_changed': False}})
              oha = ensure_oha()
              meta = provenance(oha)
              meta['github'] = {k: os.environ.get(k) for k in ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'RUNNER_NAME', 'ImageVersion']}
              meta['cpu_model'] = Path('/proc/cpuinfo').read_text()
              atomic_json(out / 'metadata.json', meta)

              server = (ROOT / 'apps/python-flask/benchmark_api/server.py').read_text()
              require(server.count('asyncore_use_poll=True') == 1, 'server configuration drift')
              (payload / 'select_server.py').write_text(server.replace('asyncore_use_poll=True', 'asyncore_use_poll=False'))
              (payload / 'gunicorn_app.py').write_text('''import atexit
          from benchmark_api.app import create_app
          from benchmark_api.database import open_pool, close_pool
          pool = open_pool()
          atexit.register(close_pool, pool)
          app = create_app(pool)
          ''')
              # Reuse only the pure parse/CPU functions, not either web framework.
              import ast
              source = (ROOT / 'apps/python-flask/benchmark_api/app.py').read_text()
              tree = ast.parse(source)
              functions = '\n\n'.join(ast.get_source_segment(source, n) for n in tree.body
                                     if isinstance(n, ast.FunctionDef) and n.name in ('parse_id', 'fibonacci'))
              (payload / 'starlette_app.py').write_text('''import re
          from contextlib import asynccontextmanager
          from starlette.applications import Starlette
          from starlette.responses import JSONResponse
          from starlette.routing import Route
          from benchmark_api import database
          SIGNED_DECIMAL = re.compile(r"[+-]?[0-9]+")
          ''' + functions + '''

          @asynccontextmanager
          async def lifespan(app):
              app.state.pool = await database.open_pool()
              try:
                  yield
              finally:
                  await database.close_pool(app.state.pool)

          async def health(request):
              return JSONResponse({"status": "ok"})

          async def json_response(request):
              return JSONResponse({"message": "Hello, World!", "items": [1, 2, 3, 4, 5]})

          async def db_item(request):
              try:
                  item_id = parse_id(request.path_params["id"])
              except ValueError:
                  return JSONResponse({"error": "invalid id"}, status_code=400)
              try:
                  row = await request.app.state.pool.fetchrow("SELECT id, name, price FROM items WHERE id = $1", item_id)
                  if row is None:
                      return JSONResponse({"error": "not found"}, status_code=404)
                  return JSONResponse({"id": row["id"], "name": row["name"], "price": row["price"]})
              except Exception:
                  return JSONResponse({"error": "internal server error"}, status_code=500)

          async def cpu(request):
              return JSONResponse({"input": 30, "result": fibonacci(30)})

          app = Starlette(lifespan=lifespan, routes=[Route("/health", health), Route("/json", json_response),
              Route("/db/{id:path}", db_item), Route("/cpu", cpu)])
          ''')
              lock = payload / 'extra.lock'
              lock.write_text('gunicorn==26.0.0 --hash=sha256:40233d26a5f0d1872916188c276e21641155111c2853f0c2cd55260aec0d24fc\n'
                              'packaging==25.0 --hash=sha256:29572ef2b1f17581046b3a2227d5c611fb25ec70ca1ba8554b24b0e69331a484\n')
              images = {}
              for name, directory in [('flask', 'python-flask'), ('fastapi', 'python-fastapi')]:
                  tag = 'sab-alternatives-' + name + ':' + os.environ['GITHUB_RUN_ID']
                  log = execute(['docker', 'build', '--tag', tag, str(ROOT / 'apps' / directory)], timeout=900)
                  (out / (name + '-build.log')).write_text(log)
                  images[name] = execute(['docker', 'image', 'inspect', '--format', '{{.Id}}', tag], timeout=10).strip()
              (payload / 'Dockerfile').write_text('FROM sab-alternatives-flask:' + os.environ['GITHUB_RUN_ID'] + '\nUSER root\nCOPY extra.lock /tmp/extra.lock\n'
                  'RUN python -m pip install --no-cache-dir --only-binary=:all: --require-hashes -r /tmp/extra.lock && python -m pip check\nUSER 10001:10001\n')
              tag = 'sab-alternatives-gunicorn:' + os.environ['GITHUB_RUN_ID']
              (out / 'gunicorn-build.log').write_text(execute(['docker', 'build', '--tag', tag, str(payload)], timeout=300))
              images['gunicorn'] = execute(['docker', 'image', 'inspect', '--format', '{{.Id}}', tag], timeout=10).strip()
              atomic_json(out / 'images.json', images)
              for name, image in images.items():
                  data = execute(['docker', 'run', '--rm', '--entrypoint', 'python', image, '-c',
                      'import json,sys,importlib.metadata as m; print(json.dumps({"python":sys.version,"packages":{d.metadata["Name"]:d.version for d in m.distributions()}}))'], timeout=30)
                  atomic_json(out / (name + '-versions.json'), strict_json(data.encode()))

              class ProbeEnvironment(DockerEnvironment):
                  def __init__(self, arm, directory):
                      super().__init__(oha, directory, health_policy=EXTERNAL_READINESS)
                      self.arm = arm
                      self.service = 'python-fastapi' if arm in ('starlette', 'fastapi-control') else 'python-flask'
                      self.image = images['gunicorn' if arm.startswith('gunicorn') else 'fastapi' if self.service == 'python-fastapi' else 'flask']
                      self.process_ids = None
                      service = {'image': self.image, 'healthcheck': {'disable': True}}
                      if arm not in ('waitress-baseline', 'fastapi-control'):
                          service['environment'] = {'PYTHONPATH': '/app:/probe'}
                          service['volumes'] = [{'type': 'bind', 'source': str(payload), 'target': '/probe', 'read_only': True}]
                      if arm == 'waitress-select':
                          service.update(entrypoint=['python', '-m', 'select_server'], command=[])
                      if arm.startswith('gunicorn'):
                          worker = 'gthread' if arm == 'gunicorn-gthread' else 'sync'
                          service.update(entrypoint=['python', '-m', 'gunicorn'], command=['--bind', '0.0.0.0:8080',
                              '--workers', '1', '--worker-class', worker, '--threads', '1', '--keep-alive', '5',
                              '--timeout', '30', '--graceful-timeout', '5', '--worker-tmp-dir', '/dev/shm', 'gunicorn_app:app'])
                      if arm == 'starlette':
                          service.update(entrypoint=['python', '-m', 'uvicorn'], command=['starlette_app:app', '--host', '0.0.0.0',
                              '--port', '8080', '--workers', '1', '--loop', 'asyncio', '--http', 'h11', '--no-access-log', '--timeout-graceful-shutdown', '5'])
                      override = self.artifacts / 'override.json'
                      atomic_json(override, {'services': {self.service: service}})
                      self.prefix = self.prefix[:-2] + ['-f', str(override), *self.prefix[-2:]]

                  def processes(self):
                      text = execute(['docker', 'top', self.container, '-eo', 'pid,ppid,args'], timeout=10)
                      ids = validate_process_snapshot(text, self.arm.startswith('gunicorn'), self.process_ids)
                      self.process_ids = ids
                      return text

                  def start_probe(self):
                      self.implementation = self.service
                      execute(self.prefix + ['up', '--detach', '--wait', '--wait-timeout', '60', 'postgres'], timeout=120)
                      execute(self.prefix + ['up', '--detach', '--no-build', self.service], timeout=120)
                      self.container = execute(self.prefix + ['ps', '--quiet', self.service], timeout=10).strip()
                      state = self.inspect()
                      self.identity = validate_state(state, self.project, self.service)
                      require(state['Config']['Healthcheck']['Test'] == ['NONE'], 'API healthcheck is active')
                      require(state['Image'] == self.image, 'image identity changed')
                      require(state['HostConfig'].get('CpusetCpus', '') == '', 'CPU affinity changed')
                      self.readiness = wait_external_readiness('http://127.0.0.1:8080', self.service, self.check,
                          timeout_seconds=60.0, request_timeout=2.0)
                      (self.artifacts / 'processes-before.txt').write_text(self.processes())
                      atomic_json(self.artifacts / 'container.json', self.inspect())
                      return {'id': self.container, 'image_id': state['Image'], 'command': [state['Path'], *state['Args']],
                          'os_processes': len(self.process_ids), 'request_workers': 1}

                  def measure(self, endpoint, duration, index):
                      self.processes()
                      value = super().measure(endpoint, duration, index)
                      self.processes()
                      return value

              def keepalive(expected):
                  conn = http.client.HTTPConnection('127.0.0.1', 8080, timeout=5)
                  try:
                      conn.request('GET', '/json')
                      response = conn.getresponse()
                      require(response.status == 200, 'connection probe failed')
                      closes = response.will_close
                      response.read()
                      sock = conn.sock
                      conn.request('GET', '/json')
                      response = conn.getresponse()
                      require(response.status == 200, 'second connection probe failed')
                      response.read()
                      reused = sock is not None and conn.sock is sock and not closes
                      require(reused is expected, 'unexpected keep-alive behavior')
                      return {'same_socket_reused': reused, 'first_response_will_close': closes}
                  finally:
                      conn.close()

              active = [None]
              def interrupt(signum, frame):
                  raise KeyboardInterrupt('signal ' + str(signum))
              signal.signal(signal.SIGTERM, interrupt)
              results = []
              for cell in plan:
                  directory = out / f"block-{cell['block']}-{cell['arm']}"
                  entry = {**cell, 'status': 'running', 'measurements': []}
                  results.append(entry)
                  atomic_json(out / 'progress.json', {'official': False, 'publishable': False, 'cells': results})
                  env = ProbeEnvironment(cell['arm'], directory)
                  active[0] = env
                  print('CELL ' + json.dumps(cell), flush=True)
                  try:
                      entry['container'] = env.start_probe()
                      entry['contract_checks'] = run_contract('http://127.0.0.1:8080', implementation=env.service)
                      require(entry['contract_checks'] == 2 * len(load_cases()), 'incomplete contract')
                      entry['transport'] = keepalive(cell['arm'] != 'gunicorn-sync')
                      for endpoint in cell['endpoints']:
                          measured = {'endpoint': endpoint, 'runs': []}
                          entry['measurements'].append(measured)
                          measured['warmup'] = env.measure(endpoint, 5, 0)
                          validate_run(measured['warmup'])
                          for index in (1, 2, 3):
                              value = env.measure(endpoint, 5, index)
                              validate_run(value)
                              measured['runs'].append(value)
                              atomic_json(out / 'progress.json', {'official': False, 'publishable': False, 'cells': results})
                          measured['selected'] = select_run(measured['runs'])
                      entry['status'] = 'success'
                  except Exception as error:
                      entry['status'] = 'failed'
                      entry['error'] = type(error).__name__ + ': ' + str(error)
                      traceback.print_exc()
                  finally:
                      try:
                          if env.container:
                              (env.artifacts / 'server.log').write_text(execute(['docker', 'logs', '--tail', '300', env.container], timeout=10))
                              (env.artifacts / 'processes-after.txt').write_text(env.processes())
                      except Exception as error:
                          entry['status'] = 'failed'
                          entry['final_observation_error'] = type(error).__name__ + ': ' + str(error)
                      finally:
                          with protect_cleanup():
                              env.cleanup()
                          entry['cleanup'] = 'success'
                          active[0] = None
                          atomic_json(out / 'progress.json', {'official': False, 'publishable': False, 'cells': results})
                  print('CELL_RESULT ' + json.dumps(entry), flush=True)
              require(not execute(['git', 'status', '--porcelain', '--untracked-files=normal'], timeout=10).strip(), 'tracked source/output changed')
              ok = all(e['status'] == 'success' for e in results)
              report = {'mode': 'disposable-alternatives-screen', 'official': False, 'publishable': False,
                  'status': 'complete' if ok else 'partial-failure', 'metadata': meta, 'plan': plan, 'cells': results,
                  'limitations': ['Single host, two order blocks, five-second screening windows; not an official result.',
                  'Gunicorn has two OS processes; sync changes connection reuse. Starlette changes the stack.',
                  'CPU endpoint correctness checked, not performance measured. Production failure/shutdown gates remain separate.']}
              atomic_json(out / 'diagnostic.json', report)
              print('SCREENING_SUMMARY ' + json.dumps([{k: e[k] for k in ('block', 'arm', 'status', 'measurements')} for e in results]), flush=True)
              checksums = {str(p.relative_to(out)): hashlib.sha256(p.read_bytes()).hexdigest()
                           for p in sorted(out.rglob('*')) if p.is_file()}
              atomic_json(out / 'sha256.json', checksums)
              require(ok, 'one or more candidates failed; see all retained attempts')


          if __name__ == '__main__':
              import sys
              if sys.argv[1:] == ['--self-test']:
                  unittest.main(argv=[sys.argv[0]], verbosity=2)
              elif not sys.argv[1:]:
                  main()
              else:
                  raise SystemExit('Usage: probe.py [--self-test]')
          PY_PROBE
      - name: Test process isolation and run non-publishing screen
        run: |
          set -euo pipefail
          python .cache/flask-alternatives/probe.py --self-test
          python .cache/flask-alternatives/probe.py
      - name: Retain every attempt and raw window
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flask-alternatives-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/flask-alternatives/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
