name: Java development
on:
  push:
    branches: [feat/add-java-spring-boot]
permissions:
  contents: read
concurrency:
  group: java-development-67
  cancel-in-progress: false
jobs:
  unit:
    if: github.repository == 'tappe9/simple-api-benchmark' && github.ref == 'refs/heads/feat/add-java-spring-boot'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fail-closed acceptance helpers and static Java metadata
        run: |
          python3 -m unittest discover -s tests -p test_java_spring_boot_acceptance.py -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          from benchmark.java_versions import pinned_versions
          print(json.dumps(pinned_versions(Path('apps/java-spring-boot')), indent=2))
          PY
      - name: Read exact ARM64 JDK asset identity from its public release
        run: |
          set -euo pipefail
          mkdir -p .cache/java-development
          curl --fail --silent --show-error --location --max-time 60 'https://api.github.com/repos/adoptium/temurin25-binaries/releases/tags/jdk-25.0.4.1%2B1' -o .cache/java-development/release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.cache/java-development/release.json').read_text())
          wanted = 'OpenJDK25U-jdk_aarch64_linux_hotspot_25.0.4.1_1.tar.gz'
          assets = [asset for asset in data['assets'] if asset['name'] == wanted or asset['name'] == wanted + '.sha256.txt']
          for asset in assets:
              print(json.dumps({key: asset.get(key) for key in ('id', 'name', 'digest', 'size', 'browser_download_url')}, indent=2))
          if not any(asset['name'] == wanted for asset in assets):
              raise RuntimeError('the selected ARM64 JDK is not present in its release')
          PY
      - name: Export exact source identity
        if: always()
        run: |
          mkdir -p .cache/java-development
          git rev-parse HEAD HEAD^{tree} > .cache/java-development/source-identity.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: java-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/java-development/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
