name: Java development
on:
  push:
    branches: [feat/add-java-spring-boot]
permissions:
  contents: read
concurrency:
  group: java-development-67
  cancel-in-progress: false
jobs:
  documentation:
    if: github.repository == 'tappe9/simple-api-benchmark' && github.ref == 'refs/heads/feat/add-java-spring-boot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - name: Apply the reviewed public-documentation patch without credentials
        run: python .github/java67-prepare.py
      - name: Verify registration and unchanged generated results
        run: |
          set -euo pipefail
          python -m benchmark.registry --check
          python -m benchmark.generate_readme --check
          python -m unittest discover -s tests -p 'test_benchmark_java*.py' -v
          git diff --check
          git diff --exit-code 6e25eb07759bd6eed4de9ab9ee3d1dd35562932b -- results apps/go-gin apps/go-echo apps/rust-actix apps/rust-axum apps/node-fastify apps/node-express apps/python-fastapi apps/python-flask .github/workflows/benchmark.yml .github/workflows/pages.yml .github/workflows/pages-deploy.yml
      - name: Export exact source identities
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree} refs/remotes/origin/main > .cache/java-documentation/source-identity.txt
          git bundle create .cache/java-documentation/source.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        with:
          name: java-documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/java-documentation/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  import-objects:
    needs: documentation
    if: github.repository == 'tappe9/simple-api-benchmark' && github.ref == 'refs/heads/feat/add-java-spring-boot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.documentation.outputs.artifact_id }}
          path: verified-documentation
          merge-multiple: true
      - name: Import fixed public-documentation blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request
          expected = {'README.md': '76a5ea4b0c8d0f9f60c322ab6a6a577b1b7145c4', 'README.ja.md': 'f2f69ddd8bc98e928e935cb677ce3b58ee445983', 'CONTRIBUTING.md': 'a4a774be53a58e1af52e41c03fd008037f26e64e', 'ARCHITECTURE.md': '78aca583561922acee0abc3d1f4d1c773d31619e', 'ROADMAP.md': '0472b929708f17a7f6c2dbbaaf3c707fcb2a528f', 'docs/IMPLEMENTATIONS.md': 'a61b40860bd80323341e853002aadbf30e4aa586', 'docs/AUTOMATION.md': 'f9b07b5bd3a44e4e8330c00eff0568bc8f980943', 'docs/METHODOLOGY.md': '7f42d37388b5aa1fd97775c2c9cb4ba69595797c', 'docs/JAVA-SPRING-BOOT.md': 'cd755d3ff77900cdb630dc75beb6c5e935ce2175'}
          root = Path('verified-documentation/files')
          if {str(path.relative_to(root)) for path in root.rglob('*') if path.is_file()} != set(expected):
              raise RuntimeError('unexpected documentation artifact manifest')
          candidates = []
          for name, sha in expected.items():
              path = root / name
              if path.is_symlink() or any(parent.is_symlink() for parent in path.parents) or not path.is_file() or not 0 < path.stat().st_size < 200_000:
                  raise RuntimeError('unsafe documentation file')
              data = path.read_bytes()
              data.decode('utf-8')
              if hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != sha:
                  raise RuntimeError('unreviewed documentation content')
              candidates.append((name, sha, data))
          result = []
          for name, sha, data in candidates:
              request = urllib.request.Request(
                  'https://api.github.com/repos/tappe9/simple-api-benchmark/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode('ascii')}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  created = json.load(response)
              if created.get('sha') != sha:
                  raise RuntimeError('documentation Git blob mismatch')
              result.append({'path': name, 'sha': sha, 'mode': '100644', 'type': 'blob'})
          print(json.dumps(result, indent=2))
          PYTHON
