name: Java development
on:
  push:
    branches: [feat/add-java-spring-boot]
permissions:
  contents: read
concurrency:
  group: java-development-67
  cancel-in-progress: false
jobs:
  unit:
    if: github.repository == 'tappe9/simple-api-benchmark' && github.ref == 'refs/heads/feat/add-java-spring-boot'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the exact checksum-verified JDK
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 180 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz' -o "$RUNNER_TEMP/java67.tar.gz"
          echo "dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e  $RUNNER_TEMP/java67.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/java67/jdk"
          tar -xzf "$RUNNER_TEMP/java67.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/java67/jdk"
          echo "JAVA_HOME=$RUNNER_TEMP/java67/jdk" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/java67/gradle-home" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/java67/jdk/bin" >> "$GITHUB_PATH"
      - name: Execute committed locked Java tests and production distribution
        run: |
          set -euo pipefail
          mkdir -p .cache/java-development
          cd apps/java-spring-boot
          sha256sum gradle.lockfile gradle/verification-metadata.xml gradle/wrapper/* > ../../.cache/java-development/dependencies.before
          ./gradlew --no-daemon test installDist 2>&1 | tee ../../.cache/java-development/java-tests.log
          sha256sum --check ../../.cache/java-development/dependencies.before
          git diff --exit-code -- gradle.lockfile gradle/verification-metadata.xml gradle/wrapper
      - name: Verify acceptance regression tests are red before the harness exists
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p test_java_spring_boot_acceptance.py -v > .cache/java-development/acceptance-red.log 2>&1
          status=$?
          set -e
          cat .cache/java-development/acceptance-red.log
          test "$status" -ne 0
          grep -q "No module named 'test_java_spring_boot_service'" .cache/java-development/acceptance-red.log
          test ! -f tests/test_java_spring_boot_service.py
      - name: Confirm exact ARM64 JDK release metadata
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          url = 'https://api.adoptium.net/v3/assets/feature_releases/25/ga?architecture=aarch64&heap_size=normal&image_type=jdk&jvm_impl=hotspot&os=linux&page_size=1&project=jdk&sort_order=DESC&vendor=eclipse'
          with urllib.request.urlopen(url, timeout=60) as response:
              releases = json.load(response)
          for release in releases:
              if release['release_name'] != 'jdk-25.0.4.1+1':
                  raise RuntimeError('unexpected upstream Java release')
              print(json.dumps({'release_name': release['release_name'], 'version': release['version_data'], 'package': release['binaries'][0]['package']}, indent=2))
          if len(releases) != 1:
              raise RuntimeError('expected exactly one upstream release')
          PY
      - name: Export exact source and test evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .cache/java-development
          git rev-parse HEAD HEAD^{tree} > .cache/java-development/source-identity.txt
          if test -d apps/java-spring-boot/build/test-results; then
            cp -a apps/java-spring-boot/build/test-results .cache/java-development/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: java-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/java-development/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
