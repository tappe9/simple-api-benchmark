name: Bootstrap repository metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-metadata.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Create milestone and labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]
          api_base = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "simple-api-benchmark-bootstrap",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  api_base + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      return None if not body else json.loads(body)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  print(
                      f"GitHub API {method} {path} failed: {error.code} {detail}",
                      file=sys.stderr,
                  )
                  raise

          milestone_title = "v0.1.0"
          milestone_description = (
              "Build v0.1.0: four API stacks, three simple benchmarks, "
              "one-command local execution, weekly GitHub Actions results, "
              "and an easy-to-read GitHub Pages view."
          )
          milestones = api("GET", "/milestones?state=all&per_page=100")
          milestone = next(
              (item for item in milestones if item["title"] == milestone_title),
              None,
          )
          if milestone is None:
              milestone = api(
                  "POST",
                  "/milestones",
                  {
                      "title": milestone_title,
                      "state": "open",
                      "description": milestone_description,
                  },
              )
              print(f"Created milestone #{milestone['number']}: {milestone_title}")
          else:
              api(
                  "PATCH",
                  f"/milestones/{milestone['number']}",
                  {
                      "title": milestone_title,
                      "state": "open",
                      "description": milestone_description,
                  },
              )
              print(f"Updated milestone #{milestone['number']}: {milestone_title}")

          desired_labels = [
              {"name": "bug", "color": "d73a4a", "description": "Something is not working"},
              {"name": "documentation", "color": "0075ca", "description": "Documentation changes"},
              {"name": "enhancement", "color": "a2eeef", "description": "New or improved functionality"},
              {"name": "good first issue", "color": "7057ff", "description": "Suitable for a first contribution"},
              {"name": "help wanted", "color": "008672", "description": "Extra attention is welcome"},
              {"name": "maintenance", "color": "fef2c0", "description": "Repository or dependency maintenance"},
              {"name": "contract", "color": "5319e7", "description": "Shared API behavior and contract tests"},
              {"name": "docker", "color": "2496ed", "description": "Docker Compose and container environment"},
              {"name": "implementation", "color": "bfdadc", "description": "Backend implementation work"},
              {"name": "benchmark", "color": "d93f0b", "description": "Benchmark runner, metrics, and results"},
              {"name": "github-actions", "color": "2088ff", "description": "GitHub Actions automation"},
              {"name": "website", "color": "f9d0c4", "description": "GitHub Pages and result presentation"},
              {"name": "go", "color": "00add8", "description": "Go and Gin implementation"},
              {"name": "rust", "color": "b7410e", "description": "Rust and Actix Web implementation"},
              {"name": "nodejs", "color": "339933", "description": "Node.js and Fastify implementation"},
              {"name": "python", "color": "3776ab", "description": "Python and FastAPI implementation"},
              {"name": "priority: high", "color": "b60205", "description": "Required on the v0.1 critical path"},
          ]

          existing_labels = {
              item["name"]: item for item in api("GET", "/labels?per_page=100")
          }
          for label in desired_labels:
              name = label["name"]
              if name in existing_labels:
                  api(
                      "PATCH",
                      "/labels/" + urllib.parse.quote(name, safe=""),
                      {
                          "new_name": name,
                          "color": label["color"],
                          "description": label["description"],
                      },
                  )
                  print(f"Updated label: {name}")
              else:
                  api("POST", "/labels", label)
                  print(f"Created label: {name}")

          for unused_name in ("duplicate", "invalid", "question", "wontfix"):
              if unused_name in existing_labels:
                  api(
                      "DELETE",
                      "/labels/" + urllib.parse.quote(unused_name, safe=""),
                  )
                  print(f"Deleted unused default label: {unused_name}")

          print(
              f"Bootstrap complete: milestone #{milestone['number']} and "
              f"{len(desired_labels)} labels are ready."
          )
          PY
