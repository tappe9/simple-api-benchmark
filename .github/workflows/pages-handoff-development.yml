name: Reusable Pages development
on:
  push:
    branches: [fix/reusable-pages-handoff]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'tappe9/simple-api-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/node-fastify/.node-version
      - name: Apply only the exact reviewed candidate
        run: |
          python - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          parts = [Path(f'.github/handoff-part-{i}.bin') for i in range(3)]
          patch = gzip.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == 'e7c5c87262c4698f697f59f34502c0144fe4f482f3163bf50f247763089f6c50'
          for path in parts + [Path('.github/workflows/pages-handoff-development.yml')]:
              path.unlink()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '4f8e5c59b0d37f13e1baad4f1716a10a7c8bc1b1', tree
          PY
      - name: Reproduce RED on the unchanged baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" 25fa3f086919f7124afe3c8d22f0791bd83768ef
          cp tests/test_benchmark_pages_handoff.py "$RUNNER_TEMP/baseline/tests/"
          cd "$RUNNER_TEMP/baseline"
          python -m unittest discover -s tests -p test_pages.py -v
          if python -m unittest discover -s tests -p test_benchmark_pages_handoff.py -v > "$RUNNER_TEMP/red.log" 2>&1; then
            cat "$RUNNER_TEMP/red.log"
            echo 'New regression unexpectedly passed on baseline.'
            exit 1
          fi
          grep 'reusable Pages needs an explicit caller/publication authorization boundary' "$RUNNER_TEMP/red.log"
      - name: Verify GREEN and optimized Python 3.10 behavior
        run: |
          python -m unittest discover -s tests -p test_benchmark_pages_handoff.py -v
          python -O -m unittest discover -s tests -p test_benchmark_pages_handoff.py -v
          python -m benchmark.registry --check
          python -m benchmark.generate_readme --check
          git diff --cached --check
      - name: Check workflow contracts, formatting, and the real browser
        run: |
          python -m pip install --only-binary=:all: PyYAML==6.0.3 ruff==0.16.5
          python -m ruff format --check --target-version py310 --config apps/python-fastapi/pyproject.toml benchmark tests/test_benchmark_pages_handoff.py tests/test_workflows.py tests/test_pages_workflow_eligibility.py
          python -m ruff check --target-version py310 --config apps/python-fastapi/pyproject.toml benchmark tests/test_benchmark_pages_handoff.py tests/test_workflows.py tests/test_pages_workflow_eligibility.py
          python -m unittest discover -s tests -p test_workflows.py -v
          python -m unittest discover -s tests -p test_pages_workflow_eligibility.py -v
          make test-site
          test "$(git write-tree)" = 4f8e5c59b0d37f13e1baad4f1716a10a7c8bc1b1
  commit:
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      github.repository == 'tappe9/simple-api-benchmark' &&
      github.ref == 'refs/heads/fix/reusable-pages-handoff'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the verified tree without executing project code
        run: |
          python3 - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          parts = [Path(f'.github/handoff-part-{i}.bin') for i in range(3)]
          patch = gzip.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == 'e7c5c87262c4698f697f59f34502c0144fe4f482f3163bf50f247763089f6c50'
          for path in parts + [Path('.github/workflows/pages-handoff-development.yml')]:
              path.unlink()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '4f8e5c59b0d37f13e1baad4f1716a10a7c8bc1b1', tree
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: deploy verified results through reusable Pages workflow' -m 'Preserve producer provenance and publication integrity; use one direct official handoff and reject stale deployments. Refs #59.'
      - name: Fast-forward only the approved development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          branch = 'refs/heads/fix/reusable-pages-handoff'
          current = subprocess.check_output(['git', 'ls-remote', 'origin', branch], text=True).split()
          assert current == [os.environ['GITHUB_SHA'], branch], 'development branch advanced'
          auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          env = dict(os.environ, GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + branch], env=env, check=True)
          PY
      - name: Retain exact committed source for verification
        run: git bundle create "$RUNNER_TEMP/handoff-ready.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handoff-ready-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff-ready.bundle
          retention-days: 1
          if-no-files-found: error
