name: Validate Issue 5

on:
  push:
    branches: [feat/issue-5-node-fastify]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: issue5-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: false
      - name: Verify published versions and image
        working-directory: apps/node-fastify
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node --version)" = v24.20.0
          curl --fail --silent --show-error https://nodejs.org/dist/index.json | python3 -c 'import json,sys; r=next(x for x in json.load(sys.stdin) if x["version"]=="v24.20.0"); assert r["lts"]; print(json.dumps(r, sort_keys=True))'
          npm view fastify@5.12.3 version engines dist.integrity --json
          npm view pg@8.23.0 version engines dist.integrity --json
          docker buildx imagetools inspect node:24.20.0-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e
      - name: Reproduce the tests-first Red commit
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/issue5-red" b92efd42c4942d9b27954f026da3e1a14b36c42d
          cd "$RUNNER_TEMP/issue5-red/apps/node-fastify"
          test ! -e src/app.js
          npm ci
          for path in test/*.test.js; do node --check "$path"; done
          set +e
          npm test > "$RUNNER_TEMP/issue5-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/issue5-red.log"
          test "$status" -ne 0
          grep -q ERR_MODULE_NOT_FOUND "$RUNNER_TEMP/issue5-red.log"
          grep -q '/src/app.js' "$RUNNER_TEMP/issue5-red.log"
          grep -q '/src/database.js' "$RUNNER_TEMP/issue5-red.log"
          echo 'RED_CONFIRMED: production modules absent; dependencies and test syntax valid'
      - name: Node quality gates
        working-directory: apps/node-fastify
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run lint
          git diff --exit-code -- package-lock.json
      - name: Static quality gates
        run: |
          set -euo pipefail
          docker compose config
          python3 tests/test_database_environment.py --static
          python3 tests/test_go_gin_service.py --static
          if test -f tests/test_rust_actix_service.py; then
            python3 tests/test_rust_actix_service.py --static
          else
            echo 'Rust static gate: not applicable; implementation absent from current main'
          fi
          python3 tests/test_node_fastify_service.py --static
          git diff --check
      - name: PostgreSQL regression
        run: make test-db
      - name: Go Gin regression
        run: make test-go-gin
      - name: Rust regression when present
        run: |
          if test -f tests/test_rust_actix_service.py; then
            make test-rust-actix
          else
            echo 'Rust runtime gate: not applicable; PR #13 is not merged'
          fi
      - name: Node Docker acceptance
        run: make test-node-fastify
      - name: Cleanup and verify no project resources remain
        if: always()
        run: |
          set -euo pipefail
          make down
          docker compose ps -a
          test -z "$(docker compose ps -a --quiet)"
          test -z "$(docker network ls --quiet --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          git diff --check
