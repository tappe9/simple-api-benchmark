name: Flask development integration helper

on:
  push:
    branches:
      - issue-32-python-flask
    paths:
      - benchmark/implementations.json
      - apps/python-flask/requirements.in
      - .github/workflows/flask-development.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: issue-32-python-flask
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
          check-latest: false
      - name: Patch Flask version extraction and generate projections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('benchmark/environment.py')
          text = path.read_text()
          old = '''    python = dict(\n        re.findall(r"^([a-z]+)==([0-9.]+)$", read("python-fastapi/requirements.in"), re.MULTILINE)\n    )\n'''
          new = '''    python = dict(\n        re.findall(r"^([a-z]+)==([0-9.]+)$", read("python-fastapi/requirements.in"), re.MULTILINE)\n    )\n    python_flask = dict(\n        re.findall(\n            r"^([a-z][a-z0-9-]*)==([0-9.]+)$",\n            read("python-flask/requirements.in"),\n            re.MULTILINE,\n        )\n    )\n'''
          if old not in text:
              raise SystemExit('FastAPI version extractor marker missing')
          text = text.replace(old, new, 1)
          old_entry = '        "python-fastapi": {"python": read("python-fastapi/.python-version").strip(), **python},\n'
          new_entry = old_entry + '        "python-flask": {\n            "python": read("python-flask/.python-version").strip(),\n            **python_flask,\n        },\n'
          if old_entry not in text:
              raise SystemExit('FastAPI version entry marker missing')
          path.write_text(text.replace(old_entry, new_entry, 1))

          service = Path('tests/test_python_flask_service.py')
          source = service.read_text()
          if source.startswith('#!/usr/bin/env python3\n'):
              source = source.split('\n', 1)[1]
          source = source.replace(
              'result = subprocess.run(command, cwd=cwd, capture_output=True, text=True, timeout=timeout)',
              'result = subprocess.run(command, cwd=cwd, capture_output=True, text=True, timeout=timeout, check=False)',
          )
          service.write_text(source)
          PY
          python -m benchmark.registry --write
          python -m benchmark.registry --check
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r apps/python-flask/requirements-dev.lock
          python -m ruff format benchmark/environment.py tests/test_benchmark_python_flask_candidate.py tests/test_python_flask_acceptance.py tests/test_python_flask_service.py
          python -m ruff check benchmark/environment.py tests/test_benchmark_python_flask_candidate.py tests/test_python_flask_acceptance.py tests/test_python_flask_service.py
      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark/environment.py benchmark/implementations.mk site/registry.mjs tests/test_benchmark_python_flask_candidate.py tests/test_python_flask_acceptance.py tests/test_python_flask_service.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: generate Flask registry integration'
          git push origin HEAD:issue-32-python-flask
