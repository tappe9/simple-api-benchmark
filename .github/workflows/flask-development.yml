name: Flask development docs helper

on:
  push:
    branches:
      - issue-32-python-flask
    paths:
      - .github/workflows/flask-development.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: issue-32-python-flask
      - name: Synchronize README implementation inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          en = Path('README.md')
          text = en.read_text()
          text = text.replace('contains six API implementations', 'contains eight API implementations')
          text = text.replace(
              'Go / Echo and Rust / Axum are implemented and CI-covered, while',
              'Go / Echo, Rust / Axum, Node.js / Express, and Python / Flask are implemented and CI-covered, while',
          )
          text = text.replace('| Node.js | Fastify |\n| Python | FastAPI |', '| Node.js | Fastify |\n| Node.js | Express |\n| Python | FastAPI |\n| Python | Flask |', 1)
          text = text.replace('All six API implementations', 'All eight API implementations')
          en.write_text(text)

          ja = Path('README.ja.md')
          text = ja.read_text()
          text = text.replace('6つのAPI実装があります', '8つのAPI実装があります')
          text = text.replace(
              'Go / EchoとRust / Axumは実装済みでCI対象ですが',
              'Go / Echo、Rust / Axum、Node.js / Express、Python / Flaskは実装済みでCI対象ですが',
          )
          text = text.replace('| Node.js | Fastify |\n| Python | FastAPI |', '| Node.js | Fastify |\n| Node.js | Express |\n| Python | FastAPI |\n| Python | Flask |', 1)
          text = text.replace('6つのAPI実装', '8つのAPI実装')
          ja.write_text(text)
          PY
          git diff --check
      - name: Commit README synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.ja.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: synchronize eight implementation inventory'
          git push origin HEAD:issue-32-python-flask
