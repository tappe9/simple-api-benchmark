name: Eight-stack rollout verification
on:
  push:
    branches: [ops/verify-eight-stack-rollout]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'tappe9/simple-api-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: c8e033ea176366644f5bed5ded12cab79e6fcbeb
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/node-fastify/.node-version
      - name: Audit completed official publication and every live Pages file
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, re, subprocess, time, urllib.request
          from datetime import datetime
          from pathlib import Path
          from benchmark.generate_readme import render, replace_section
          from benchmark.publication import expected_publication_paths, history_path
          from benchmark.readme_charts import render_charts
          from benchmark.report import validate_report
          from benchmark.site import build
          repo = 'tappe9/simple-api-benchmark'
          source = 'c8e033ea176366644f5bed5ded12cab79e6fcbeb'
          source_tree = '9389884db4164633b45151b737fdebd8c2706176'
          publication = '25fa3f086919f7124afe3c8d22f0791bd83768ef'
          run_id = 34925168324
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'rollout-evidence'
          out.mkdir()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'ROLLOUT_EVIDENCE={out}\n')
          def api_bytes(path):
              return subprocess.run(['gh', 'api', f'repos/{repo}/{path}'], check=True, capture_output=True, timeout=60).stdout
          def api(path):
              return json.loads(api_bytes(path))
          def git(*args):
              return subprocess.run(['git', *args], check=True, capture_output=True, timeout=120).stdout
          def save(name, data):
              (out / name).write_text(json.dumps(data, indent=2) + '\n')
          assert git('rev-parse', 'HEAD').decode().strip() == source
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == source_tree
          run = api(f'actions/runs/{run_id}')
          save('official-run.json', run)
          assert run['head_sha'] == source and run['run_attempt'] == 1
          assert run['path'] == '.github/workflows/benchmark.yml'
          assert run['event'] == 'workflow_dispatch' and run['head_branch'] == 'main'
          assert run['head_repository']['full_name'] == repo
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          jobs = api(f'actions/runs/{run_id}/jobs?per_page=100')
          save('official-jobs.json', jobs)
          assert jobs['total_count'] == 2 and {j['name'] for j in jobs['jobs']} == {'measure', 'publish'}
          assert all(j['conclusion'] == 'success' for j in jobs['jobs'])
          log = api_bytes('actions/jobs/104241577063/logs')
          assert len(log) < 2*1024*1024
          (out/'measure.log').write_bytes(log)
          git('fetch', '--no-tags', '--depth=2', 'origin', 'refs/heads/main')
          assert git('rev-parse', 'FETCH_HEAD').decode().strip() == publication
          assert git('rev-list', '--parents', '-n', '1', publication).decode().split() == [publication, source]
          report_bytes = git('show', f'{publication}:results/latest.json')
          report = json.loads(report_bytes)
          expected_context = dict(repository=repo, ref='refs/heads/main', source_commit=source,
              event='workflow_dispatch', workflow_ref=repo+'/.github/workflows/benchmark.yml@refs/heads/main',
              workflow_sha=source, run_id=str(run_id), run_attempt='1',
              run_url=f'https://github.com/{repo}/actions/runs/{run_id}')
          validate_report(report, expected_context=expected_context)
          assert report['metadata']['source_tree'] == source_tree
          assert report['benchmark']['cohort'] == 'eight-stack-v1'
          assert len(report['implementations']) == 8
          assert sum(len(e['runs']) for b in report['implementations'] for e in b['endpoints']) == 72
          changed = git('diff-tree', '--no-commit-id', '--name-only', '-r', publication).decode().splitlines()
          exact = {'README.md', 'README.ja.md', 'results/latest.json',
              'results/history/2026-09-15T04-14-09Z-34925168324-1.json',
              'results/charts/json-throughput.svg', 'results/charts/postgresql-throughput.svg', 'results/charts/cpu-throughput.svg'}
          assert len(changed) == 7 and set(changed) == exact == expected_publication_paths(report)
          assert git('show', f'{publication}:{history_path(report)}') == report_bytes
          for path, locale in [('README.md', 'en'), ('README.ja.md', 'ja')]:
              expected = replace_section((root/path).read_text(), render(report, locale)).encode()
              assert git('show', f'{publication}:{path}') == expected, path
          for path, text in render_charts(report).items():
              assert git('show', f'{publication}:{path}') == text.encode(), path
          public_root = Path(os.environ['RUNNER_TEMP']) / 'verified-publication'
          git('worktree', 'add', '--detach', str(public_root), publication)
          output = build(public_root)
          expected_files = {str(p.relative_to(output)): p.read_bytes() for p in output.rglob('*') if p.is_file()}
          save('expected-files.json', {name: hashlib.sha256(data).hexdigest() for name, data in expected_files.items()})
          pages_deadline = time.monotonic() + 600
          while True:
              candidates = api(f'actions/runs?head_sha={publication}&per_page=100')['workflow_runs']
              pages = [r for r in candidates if r['path'] == '.github/workflows/pages.yml'
                  and r['head_sha'] == publication and r['head_branch'] == 'main'
                  and r['event'] in ('workflow_run', 'workflow_dispatch')
                  and r['head_repository']['full_name'] == repo]
              successful = [r for r in pages if r['status'] == 'completed' and r['conclusion'] == 'success']
              if successful:
                  pages_run = max(successful, key=lambda r: r['id'])
                  save('pages-run.json', pages_run)
                  page_jobs = api(f"actions/runs/{pages_run['id']}/jobs?per_page=100")
                  save('pages-jobs.json', page_jobs)
                  assert all(any(j['name'] == name and j['conclusion'] == 'success' for j in page_jobs['jobs']) for name in ('build','deploy'))
                  break
              assert not any(r['status'] == 'completed' and r['conclusion'] == 'failure' for r in pages), 'Pages failed'
              assert time.monotonic() < pages_deadline, 'Pages completion deadline exceeded'
              time.sleep(15)
          base = 'https://tappe9.github.io/simple-api-benchmark/'
          live_deadline = time.monotonic() + 600
          live = {}
          for name, expected in expected_files.items():
              if name == '.nojekyll':
                  continue
              while True:
                  url = base + name + '?verified-publication=' + publication
                  try:
                      request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'simple-api-benchmark-rollout-verifier'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          actual = response.read(2*1024*1024)
                          assert response.status == 200 and actual == expected, 'content mismatch: ' + name
                          live[name] = {'status': response.status, 'sha256': hashlib.sha256(actual).hexdigest()}
                      break
                  except (OSError, AssertionError) as error:
                      assert time.monotonic() < live_deadline, str(error)
                      time.sleep(15)
          starts = re.findall(r'(?m)^(\S+) \[([a-z-]+)\] build -> readiness', log.decode('utf-8-sig'))
          assert len(starts) == 8
          stage_times = []
          for i, (stamp, name) in enumerate(starts):
              end = starts[i+1][0] if i+1 < len(starts) else report['completed_at']
              stage_times.append({'implementation':name, 'start':stamp, 'end':end,
                  'build_start_through_cleanup_seconds':(datetime.fromisoformat(end.replace('Z','+00:00'))-datetime.fromisoformat(stamp.replace('Z','+00:00'))).total_seconds()})
          save('stage-times.json', stage_times)
          index = json.loads(expected_files['results/history/index.json'])
          summary = dict(measured_source=source, source_tree=source_tree, publication=publication,
              official_run_id=run_id, official_run_attempt=1, pages_run_id=pages_run['id'], pages_event=pages_run['event'],
              cohort=report['benchmark']['cohort'], implementations=8, measurements=72,
              changed_paths=changed, live_files=live, historical=index['runs'][-1])
          save('verification.json', summary)
          (out/'latest.json').write_bytes(report_bytes)
          print(json.dumps(summary, indent=2), flush=True)
      - name: Exercise the actual public dashboard in Chrome
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          original = Path('tests/test_dashboard_browser.mjs').read_text()
          prefix = original[:original.index("test('Pages dashboard works")]
          suffix = r'''
          test('authorized eight-stack publication is usable on the live Pages URL', {timeout: 180000}, async t => {
            const evidence = process.env.ROLLOUT_EVIDENCE;
            const verified = JSON.parse(await readFile(join(evidence, 'verification.json'), 'utf8'));
            const page = 'https://tappe9.github.io/simple-api-benchmark/';
            const profile = await mkdtemp(join(tmpdir(), 'sab-live-'));
            const browser = spawn(chromeBinary(), ['--headless=new', '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage', '--remote-debugging-port=0', `--user-data-dir=${profile}`, 'about:blank'], {stdio: 'ignore'});
            t.after(async () => {
              if (browser.exitCode === null && browser.signalCode === null) {
                const closed = new Promise(resolve => browser.once('close', resolve));
                browser.kill('SIGKILL'); await closed;
              }
              await rm(profile, {recursive: true, force: true, maxRetries: 5, retryDelay: 100});
            });
            const port = await pollDevToolsPort(profile);
            const targets = await pollJson(`http://127.0.0.1:${port}/json/list`);
            const target = targets.find(entry => entry.type === 'page');
            assert.ok(target?.webSocketDebuggerUrl);
            const cdp = await connectCdp(target.webSocketDebuggerUrl);
            t.after(() => cdp.close());
            await cdp.send('Runtime.enable');
            await cdp.send('Network.enable');
            await cdp.send('Network.setCacheDisabled', {cacheDisabled: true});
            await cdp.send('Page.enable');
            await cdp.send('Page.navigate', {url: page});
            await waitFor(cdp, `document.querySelectorAll('[data-result-row]').length === 24`, 60000);
            const text = await evaluate(cdp, `document.getElementById('results').textContent`);
            assert.ok(text.includes(verified.measured_source));
            assert.ok(text.includes(String(verified.official_run_id)));
            assert.match(text, /eight-stack-v1/);
            assert.match(text, /external-readiness/);
            assert.equal(await evaluate(cdp, `document.querySelectorAll('[data-implementation-filter]').length`), 8);
            assert.equal(await evaluate(cdp, `document.querySelectorAll('[data-run-row]').length`), 72);
            assert.equal(await evaluate(cdp, `document.querySelector('[data-result-json]').href`), page+'results/latest.json');
            for (const endpoint of ['/json','/db/42','/cpu']) {
              for (const metric of ['rps','mean','memory']) {
                await evaluate(cdp, `document.querySelector('[data-endpoint="${endpoint}"]').click(); document.querySelector('[data-metric="${metric}"]').click()`);
                assert.equal(await evaluate(cdp, `document.querySelectorAll('[data-chart]:not([hidden]) [data-chart-implementation]:not([hidden])').length`), 8);
              }
            }
            await evaluate(cdp, `document.querySelector('[data-language-filter="Go"]').click()`);
            assert.equal(await evaluate(cdp, `document.querySelectorAll('[data-run-details]:not([hidden])').length`), 6);
            await evaluate(cdp, `document.querySelector('[data-language-filter="Go"]').click(); document.getElementById('theme-toggle').click()`);
            assert.equal(await evaluate(cdp, `document.documentElement.dataset.theme`), 'dark');
            await evaluate(cdp, `document.getElementById('theme-toggle').click(); document.querySelector('[data-endpoint="/json"]').click(); document.querySelector('[data-metric="rps"]').click()`);
            const {writeFile} = await import('node:fs/promises');
            const latest = await cdp.send('Page.captureScreenshot', {format:'png', captureBeyondViewport:true});
            await writeFile(join(evidence,'live-latest.png'), Buffer.from(latest.data,'base64'));
            await cdp.send('Emulation.setDeviceMetricsOverride', {width:375,height:812,deviceScaleFactor:1,mobile:true});
            assert.equal(await evaluate(cdp, `document.documentElement.scrollWidth <= window.innerWidth`), true);
            await evaluate(cdp, `document.querySelector('[data-history-select]').value = ${JSON.stringify(verified.historical.id)}; document.querySelector('[data-history-select]').dispatchEvent(new Event('change', {bubbles:true}))`);
            await waitFor(cdp, `document.querySelectorAll('[data-result-row]').length === 12`, 60000);
            assert.equal(await evaluate(cdp, `document.querySelectorAll('[data-implementation-filter]').length`), 4);
            assert.equal(await evaluate(cdp, `document.querySelector('[data-implementation-filter="go-echo"]') === null`), true);
            assert.equal(await evaluate(cdp, `document.querySelector('[data-result-json]').href`), new URL(verified.historical.path,page).href);
            assert.match(await evaluate(cdp, `document.querySelector('[data-history-view]').textContent`), /does not infer regressions/i);
            const historical = await cdp.send('Page.captureScreenshot', {format:'png', captureBeyondViewport:true});
            await writeFile(join(evidence,'live-history.png'), Buffer.from(historical.data,'base64'));
            await evaluate(cdp, `document.querySelector('[data-history-select]').value = ''; document.querySelector('[data-history-select]').dispatchEvent(new Event('change', {bubbles:true}))`);
            await waitFor(cdp, `location.search === '' && document.querySelectorAll('[data-result-row]').length === 24`, 60000);
            await writeFile(join(evidence,'live-browser.json'), JSON.stringify({status:'passed', source:verified.measured_source, official_run_id:verified.official_run_id, checks:['24 result rows','72 measured-run rows','all endpoints and metrics','two-framework language filtering','light/dark theme','375px viewport','four-stack history','history JSON link','return to latest']}, null, 2));
          });
          '''
          Path('tests/.rollout-live.mjs').write_text(prefix + suffix)
          PY
          node --test tests/.rollout-live.mjs
      - name: Retain read-only verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eight-stack-rollout-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/rollout-evidence/
          retention-days: 7
          if-no-files-found: error
