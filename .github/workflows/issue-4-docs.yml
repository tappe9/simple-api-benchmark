name: Issue 4 Rust Actix documentation

on:
  push:
    branches:
      - feat/issue-4-rust-actix

permissions:
  contents: write

concurrency:
  group: issue-4-rust-actix-documentation
  cancel-in-progress: false

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Apply documentation updates
        run: |
          git pull --rebase origin feat/issue-4-rust-actix
          python3 scripts/apply_issue4_docs.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md README.ja.md ARCHITECTURE.md docs/METHODOLOGY.md CONTRIBUTING.md
            git commit -m "docs: document the Rust Actix Web workflow"
            git push
          fi
