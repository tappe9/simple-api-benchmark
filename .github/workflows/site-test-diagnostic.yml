name: Temporary site failure diagnostic
on:
  push:
    branches: [fix/flask-gunicorn-70]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - run: |
          mkdir -p .cache
          python -m unittest discover -s tests -p 'test_site.py' -v > .cache/site-test.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-test-diagnostic
          path: .cache/site-test.log
          retention-days: 1
