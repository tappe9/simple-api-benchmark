name: Temporary Flask Gunicorn TDD
on:
  push:
    branches: [fix/flask-gunicorn-70]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-flask/.python-version
      - name: Unit acceptance
        run: python -m unittest tests.test_python_flask_acceptance tests.test_benchmark_environment
      - name: Generate runtime lock
        run: |
          python -m pip install pip==25.3 pip-tools==7.5.2
          python -m piptools compile --generate-hashes --output-file=apps/python-flask/requirements.lock apps/python-flask/requirements.in
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flask-gunicorn-lock
          path: apps/python-flask/requirements.lock
          if-no-files-found: error
