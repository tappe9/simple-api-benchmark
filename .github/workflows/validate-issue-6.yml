name: Validate Issue 6

on:
  push:
    branches: [feat/issue-6-python-fastapi]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: issue6-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.7
      - name: Install exact dependencies with hash verification
        working-directory: apps/python-fastapi
        run: |
          set -euo pipefail
          python --version
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip check
      - name: Reproduce the pre-implementation Red
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/red" d69fb28dbd97dda2dbf6775cfe27ffd01f6acd85
          cd "$RUNNER_TEMP/red/apps/python-fastapi"
          set +e
          python -m pytest -q --tb=no --junitxml="$RUNNER_TEMP/red.xml" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          suite = ET.parse(pathlib.Path(os.environ['RUNNER_TEMP']) / 'red.xml').getroot()[0]
          print('RED_RESULT:', suite.attrib)
          assert int(suite.attrib['errors']) == 0
          assert int(suite.attrib['failures']) == 66
          assert int(suite.attrib['skipped']) == 0
          PY
      - name: Static checks and focused Green
        working-directory: apps/python-fastapi
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q benchmark_api tests
          python -m pytest -q
          git diff --check
      - name: Build the production image
        run: docker build --tag issue6-python:validation apps/python-fastapi
