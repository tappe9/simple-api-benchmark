name: Validate Issue 6

on:
  push:
    branches: [feat/issue-6-python-fastapi]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: issue6-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.7
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Install exact dependencies with hash verification
        working-directory: apps/python-fastapi
        run: |
          set -euo pipefail
          python --version
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip check
      - name: Reproduce the pre-implementation Red
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/red" d69fb28dbd97dda2dbf6775cfe27ffd01f6acd85
          cd "$RUNNER_TEMP/red/apps/python-fastapi"
          set +e
          python -m pytest -q --tb=no --junitxml="$RUNNER_TEMP/red.xml" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          suite = ET.parse(pathlib.Path(os.environ['RUNNER_TEMP']) / 'red.xml').getroot()[0]
          print('RED_RESULT:', suite.attrib)
          assert int(suite.attrib['errors']) == 0
          assert int(suite.attrib['failures']) == 66
          assert int(suite.attrib['skipped']) == 0
          PY
      - name: Static source checks
        run: |
          set -euo pipefail
          python tests/test_database_environment.py --static
          python tests/test_go_gin_service.py --static
          python tests/test_node_fastify_service.py --static
          python tests/test_python_fastapi_service.py --static
          git diff --check
      - name: Python focused tests and Docker acceptance
        run: make test-python-fastapi
      - name: Shared database regression
        run: make test-db
      - name: Go Gin regression
        run: make test-go-gin
      - name: Node Fastify regression
        run: make test-node-fastify
      - name: Check scope and tracked whitespace
        run: |
          set -euo pipefail
          git diff --check 1575b558cb15ecb87fcd7871126dc96920568e20 HEAD
          test -z "$(git diff --name-only 1575b558cb15ecb87fcd7871126dc96920568e20 HEAD -- apps/go-gin apps/node-fastify database)"
          test ! -d apps/rust-actix
          test -z "$(git ls-files docs/superpowers .plan)"
      - name: Final cleanup
        if: always()
        run: |
          set -euo pipefail
          make down
          docker compose ps -a
          test -z "$(docker compose ps -a --quiet)"
          test -z "$(docker network ls --quiet --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          git diff --check
