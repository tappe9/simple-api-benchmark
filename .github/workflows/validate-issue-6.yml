name: Validate Issue 6

on:
  push:
    branches: [feat/issue-6-python-fastapi]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: issue6-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.7
      - name: Resolve published dependency versions and image
        working-directory: apps/python-fastapi
        run: |
          set -euo pipefail
          python --version
          docker buildx imagetools inspect python:3.14.7-slim-bookworm
          python -m pip install --only-binary=:all: --report "$RUNNER_TEMP/dev.json" -r requirements-dev.in
          python -m pip install --dry-run --ignore-installed --only-binary=:all: --report "$RUNNER_TEMP/runtime.json" -r requirements.in
          python - <<'PY'
          import json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for kind in ('runtime', 'dev'):
              records = json.loads((root / (kind + '.json')).read_text())['install']
              lines = ['# CPython 3.14; exact versions and published wheel SHA256 hashes.']
              for record in sorted(records, key=lambda r: r['metadata']['name'].lower()):
                  name, version = record['metadata']['name'], record['metadata']['version']
                  with urllib.request.urlopen(f'https://pypi.org/pypi/{name}/{version}/json', timeout=30) as response:
                      release = json.load(response)
                  hashes = sorted({f['digests']['sha256'] for f in release['urls'] if not f['yanked'] and ('-py3-none-' in f['filename'] or '-cp314-cp314-' in f['filename'] or '-py2.py3-none-' in f['filename'])})
                  assert hashes, name
                  lines.append(name.lower().replace('_', '-') + '==' + version + ' ' + ' '.join('--hash=sha256:' + h for h in hashes))
              print('LOCK_BEGIN_' + kind)
              print('\n'.join(lines))
              print('LOCK_END_' + kind)
          PY
      - name: Run tests before production implementation
        working-directory: apps/python-fastapi
        run: |
          set -euo pipefail
          python -m compileall -q benchmark_api tests
          python -m pytest -q --junitxml="$RUNNER_TEMP/red.xml"
      - name: Inspect Red results
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/red.xml"; then
            python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          tree = ET.parse(pathlib.Path(os.environ['RUNNER_TEMP']) / 'red.xml')
          suite = tree.getroot()[0]
          print('RED_RESULT:', suite.attrib)
          assert int(suite.attrib['errors']) == 0
          assert int(suite.attrib['failures']) > 0
          PY
          fi
          git diff --check
