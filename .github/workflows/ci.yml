name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['results/**', README.md, README.ja.md]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Validate implementation registry
        run: make test-registry
      - name: Validate Compose parity
        run: make test-compose
      - name: Build implementation matrix
        id: matrix
        run: python -m benchmark.ci matrix >> "$GITHUB_OUTPUT"

  shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COMPOSE_PROJECT_NAME: sab-ci-${{ github.run_id }}-${{ github.run_attempt }}-shared
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Python 3.10 shared compatibility
        run: |
          make test-benchmark
          python -m unittest discover -s tests -p 'test_contract_*.py' -v
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/node-fastify/.node-version
      - name: Install pinned shared test tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r apps/python-fastapi/requirements-dev.lock
          python -m pip install --only-binary=:all: PyYAML==6.0.3
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Workflow syntax, security, README, and source checks
        run: |
          actionlint -color
          python -m unittest discover -s tests -p test_workflows.py -v
          mkdir -p .cache/ci
          python -m ruff format --diff --target-version py310 --config apps/python-fastapi/pyproject.toml benchmark tests/test_benchmark_*.py tests/test_compose_parity.py tests/test_contract_*.py tests/test_workflows.py tests/test_pages.py tests/test_site.py tests/registry_fixtures.py > .cache/ci/format.patch
          python -m ruff check --target-version py310 --config apps/python-fastapi/pyproject.toml benchmark tests/test_benchmark_*.py tests/test_compose_parity.py tests/test_contract_*.py tests/test_workflows.py tests/test_pages.py tests/test_site.py tests/registry_fixtures.py
          python -m benchmark.generate_readme --check
          git diff --check origin/main...HEAD
      - name: make test-registry
        run: make test-registry
      - name: make test-site
        run: make test-site
      - name: make test-db
        run: make test-db
      - name: make test-benchmark
        run: |
          make test-benchmark
          python -O -m unittest discover -s tests -p 'test_benchmark_*.py' -v
      - name: Clean only the shared Compose project
        if: always()
        run: timeout 90 docker compose -p "$COMPOSE_PROJECT_NAME" down --remove-orphans --volumes --timeout 10
      - name: Formatting diagnostic (no benchmark data)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatting-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/ci/format.patch
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  implementation:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      IMPLEMENTATION_ID: ${{ matrix.implementation }}
      COMPOSE_PROJECT_NAME: sab-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.implementation }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/node-fastify/.node-version
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Run implementation acceptance and failure gates
        run: make "test-$IMPLEMENTATION_ID"
      - name: Run focused shared contract against implementation
        run: make test-contract CONTRACT_IMPL="$IMPLEMENTATION_ID"
      - name: Clean only this implementation's Compose project
        if: always()
        run: timeout 90 docker compose -p "$COMPOSE_PROJECT_NAME" down --remove-orphans --volumes --timeout 10

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COMPOSE_PROJECT_NAME: sab-ci-${{ github.run_id }}-${{ github.run_attempt }}-smoke
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - name: make benchmark-smoke (never publish)
        run: |
          make benchmark-smoke
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Clean only the smoke Compose project
        if: always()
        run: timeout 90 docker compose -p "$COMPOSE_PROJECT_NAME" down --remove-orphans --volumes --timeout 10

  required:
    needs: [plan, shared, implementation, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Require every CI component to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARED_RESULT: ${{ needs.shared.result }}
          IMPLEMENTATION_RESULT: ${{ needs.implementation.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: python -m benchmark.ci require-success
