name: Finalize Issue 4 Rust Actix

on:
  push:
    branches:
      - finalize/issue-4-rust-actix

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: finalize-issue-4-rust-actix
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      FINAL_BRANCH: finalize/issue-4-rust-actix
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the finalization branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Synchronize repository refs
        run: |
          git fetch origin main "$FINAL_BRANCH"
          git checkout -B "$FINAL_BRANCH" "origin/$FINAL_BRANCH"

      - name: Detect an already merged implementation
        id: state
        run: |
          if git cat-file -e origin/main:apps/rust-actix/Cargo.toml 2>/dev/null; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the pinned Rust toolchain
        if: steps.state.outputs.already_merged == 'false'
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.1
          rustc --version
          cargo --version
          docker version
          docker compose version
          python3 --version

      - name: Materialize the implementation and documentation
        if: steps.state.outputs.already_merged == 'false'
        run: |
          if [ -f scripts/apply_issue4.py ]; then
            python3 scripts/apply_issue4.py
          fi
          if [ -f scripts/apply_issue4_docs.py ]; then
            python3 scripts/apply_issue4_docs.py
          fi
          test -f apps/rust-actix/Cargo.toml
          test -f apps/rust-actix/src/main.rs
          test -f tests/test_rust_actix_service.py
          python3 - <<'PY'
          from pathlib import Path

          database = Path("apps/rust-actix/src/database.rs")
          content = database.read_text(encoding="utf-8")
          content = content.replace(
              "DatabaseConfigError::InvalidPort(port_value))?;",
              "DatabaseConfigError::InvalidPort(port_value.clone()))?;",
          )
          database.write_text(content, encoding="utf-8")

          api = Path("apps/rust-actix/src/api.rs")
          content = api.read_text(encoding="utf-8")
          content = content.replace(
              "test, web, App,",
              "test as actix_test, web, App,",
          )
          content = content.replace("test::", "actix_test::")
          api.write_text(content, encoding="utf-8")
          PY
          cargo generate-lockfile --manifest-path apps/rust-actix/Cargo.toml
          cargo fmt --manifest-path apps/rust-actix/Cargo.toml

      - name: Apply safe Clippy fixes
        if: steps.state.outputs.already_merged == 'false'
        working-directory: apps/rust-actix
        run: |
          cargo clippy --fix --locked --all-targets --all-features --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt

      - name: Verify Rust formatting, tests, and lints
        if: steps.state.outputs.already_merged == 'false'
        working-directory: apps/rust-actix
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate repository contracts
        if: steps.state.outputs.already_merged == 'false'
        run: |
          python3 tests/test_database_environment.py --static
          python3 tests/test_go_gin_service.py --static
          python3 tests/test_rust_actix_service.py --static
          docker compose config
          git diff --check

      - name: Verify the shared PostgreSQL environment
        if: steps.state.outputs.already_merged == 'false'
        run: make test-db

      - name: Verify the existing Go Gin implementation
        if: steps.state.outputs.already_merged == 'false'
        run: make test-go-gin

      - name: Verify the Rust Actix Web implementation
        if: steps.state.outputs.already_merged == 'false'
        run: make test-rust-actix

      - name: Prepare the clean pull request tree
        if: steps.state.outputs.already_merged == 'false'
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-issue-4.yml \
            .github/workflows/issue-4-validation.yml \
            .github/workflows/issue-4-docs.yml \
            .github/workflows/issue-4-finalize.yml \
            .github/workflows/issue-4-finalize-retry.yml \
            .github/workflows/issue-4-validated-branch.yml \
            .github/workflows/issue-4-recovery.yml \
            .github/workflows/validated-issue4-merge.yml \
            scripts/issue4-green.py \
            scripts/apply_issue4.py \
            scripts/apply_issue4_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --quiet --cached; then
            git commit -m "chore: prepare the verified Issue 4 tree"
          fi
          git diff --check HEAD^ HEAD
          git push origin HEAD:"$FINAL_BRANCH"

      - name: Create or locate the pull request
        if: steps.state.outputs.already_merged == 'false'
        id: pull-request
        run: |
          number="$(gh pr list --head "$FINAL_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            number="$(gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f title='feat: implement the Rust Actix Web API' \
              -f head="$FINAL_BRANCH" \
              -f base='main' \
              -f body=$'## Summary\n\n- add the Rust / Actix Web implementation of the shared API contract\n- add a SQLx PostgreSQL pool capped at 10 connections\n- run exactly one Actix worker under the shared resource limits\n- add focused unit, container, and regression validation\n\n## Testing\n\n- `cargo fmt --check`\n- `cargo test --locked`\n- `cargo clippy --locked --all-targets --all-features -- -D warnings`\n- `python3 tests/test_database_environment.py --static`\n- `python3 tests/test_go_gin_service.py --static`\n- `python3 tests/test_rust_actix_service.py --static`\n- `docker compose config`\n- `make test-db`\n- `make test-go-gin`\n- `make test-rust-actix`\n- `make down`\n\nCloses #4' \
              --jq .number)"
          fi
          test -n "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Squash merge the verified pull request
        if: steps.state.outputs.already_merged == 'false'
        run: |
          head_sha="$(git rev-parse HEAD)"
          merged="$(gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/pulls/${{ steps.pull-request.outputs.number }}/merge" \
            -f merge_method='squash' \
            -f sha="$head_sha" \
            -f commit_title="feat: implement the Rust Actix Web API (#${{ steps.pull-request.outputs.number }})" \
            -f commit_message=$'Add the Rust / Actix Web API contract implementation, shared SQLx PostgreSQL integration, release container, and focused validation checks.\n\nCloses #4' \
            --jq .merged)"
          test "$merged" = "true"

      - name: Verify the completed GitHub state
        run: |
          git fetch origin main
          git cat-file -e origin/main:apps/rust-actix/Cargo.toml
          for attempt in 1 2 3 4 5; do
            state="$(gh issue view 4 --json state --jq .state)"
            if [ "$state" = "CLOSED" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Issue #4 did not close after merge" >&2
          exit 1

      - name: Delete all Issue 4 work branches
        if: success()
        run: |
          for branch in \
            "$FINAL_BRANCH" \
            validated/issue-4-rust-actix \
            feat/issue-4-rust-actix \
            feat/issue-4-rust-actix-green \
            feat/issue-4-rust-actix-impl \
            feat/issue-4-rust-actix-work \
            feat/issue-4-rust-actix-final \
            feat/issue-4-rust-actix-green-final \
            feat/issue-4-rust-actix-green-final-2 \
            feat/issue-4-rust-actix-green-final-3; do
            git push origin --delete "$branch" 2>/dev/null || true
          done

      - name: Clean up containers
        if: always()
        run: |
          make down || true
          docker compose ps -a || true
