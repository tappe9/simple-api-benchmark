name: Verify CI toolchains post-merge
on:
  push:
    branches: [ci/reduce-toolchain-setup-51]
    paths: [.github/workflows/ci51-postmerge-verification.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_MAIN: e9661814712eb76b9a8308c2f368a29cc6529fef
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e9661814712eb76b9a8308c2f368a29cc6529fef
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Recheck exact merged helper contracts
        run: |
          mkdir -p "$RUNNER_TEMP/ci51-final-evidence"
          python -m unittest discover -s tests -p test_benchmark_ci.py -v 2>&1 | tee "$RUNNER_TEMP/ci51-final-evidence/helper-tests.log"
          python -O -m unittest discover -s tests -p test_benchmark_ci.py -v 2>&1 | tee "$RUNNER_TEMP/ci51-final-evidence/helper-tests-optimized.log"
          python -m benchmark.registry --check
          python -m benchmark.generate_readme --check
          python -m benchmark.site
      - name: Verify current-main CI, ordinary Pages and served bytes
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from benchmark import registry
          expected = os.environ['EXPECTED_MAIN']
          evidence = Path(os.environ['RUNNER_TEMP']) / 'ci51-final-evidence'
          api_base = 'https://api.github.com/repos/tappe9/simple-api-benchmark/'
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def get(url):
              request = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'simple-api-benchmark-ci51-readonly-verification'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  require(response.status == 200, f'HTTP {response.status}: {url}')
                  data = response.read(8 * 1024 * 1024 + 1)
                  require(len(data) <= 8 * 1024 * 1024, 'response exceeds verification limit')
                  return data
          def api(path):
              return json.loads(get(api_base + path))
          def save(name, value):
              (evidence / name).write_text(json.dumps(value, indent=2) + '\n')
          require(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected, 'checkout is not exact merge')
          require(subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == '36b5b134085228aa2d0f0e800d2a4cf6f5c47361', 'merge tree differs from reviewed tree')
          require(api('git/ref/heads/main')['object']['sha'] == expected, 'main advanced before verification')
          deadline = time.monotonic() + 720
          def completed_run(path, event):
              while time.monotonic() < deadline:
                  listing = api(f'actions/runs?head_sha={expected}&event={event}&per_page=20')
                  candidates = [r for r in listing['workflow_runs'] if r['path'] == path and r['head_branch'] == 'main']
                  if candidates:
                      run = max(candidates, key=lambda r: r['id'])
                      if run['status'] == 'completed':
                          require(run['conclusion'] == 'success', f'{path} failed: {run["html_url"]}')
                          return run
                  time.sleep(30)
              raise RuntimeError(f'bounded wait expired for {path}')
          ci = completed_run('.github/workflows/ci.yml', 'push')
          ci_jobs = api(f'actions/runs/{ci["id"]}/jobs?per_page=100')
          expected_jobs = {'plan', 'shared', 'smoke', 'required'} | {f'implementation ({identifier})' for identifier in registry.implementation_ids()}
          require(ci_jobs['total_count'] == len(expected_jobs), 'unexpected CI job count')
          require({j['name'] for j in ci_jobs['jobs']} == expected_jobs, 'CI job identity drift')
          require(all(j['conclusion'] == 'success' for j in ci_jobs['jobs']), 'a required CI job did not succeed')
          pages = completed_run('.github/workflows/pages.yml', 'workflow_run')
          pages_jobs = api(f'actions/runs/{pages["id"]}/jobs?per_page=100')
          require(all(j['conclusion'] == 'success' for j in pages_jobs['jobs']), 'Pages job did not succeed')
          require(any(j['name'] == 'deploy / deploy' for j in pages_jobs['jobs']), 'reusable Pages deployment missing')
          save('postmerge-pages-run.json', pages)
          save('postmerge-pages-jobs.json', pages_jobs)
          save('postmerge-pages-artifacts.json', api(f'actions/runs/{pages["id"]}/artifacts?per_page=100'))
          for run_id in (34933489429, 34934161057, 35042845652, ci['id']):
              save(f'{run_id}-run.json', api(f'actions/runs/{run_id}'))
              save(f'{run_id}-jobs.json', api(f'actions/runs/{run_id}/jobs?per_page=100'))
          root = Path('.cache/site')
          hashes = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          require(len(hashes) == 10, 'unexpected built site file count')
          require(hashes['results/latest.json'] == '15f22d39e3b1ab7b73e61effdbaec378767845889ae6ab969cb631c11393e82d', 'selected result changed')
          served = {}
          for relative, digest in hashes.items():
              if relative == '.nojekyll':
                  continue
              url = 'https://tappe9.github.io/simple-api-benchmark/' + urllib.parse.quote(relative, safe='/')
              actual = get(url)
              require(actual == (root / relative).read_bytes(), f'served bytes differ: {relative}')
              served[relative] = {'status': 200, 'sha256': digest}
          require(api('git/ref/heads/main')['object']['sha'] == expected, 'main advanced during verification')
          save('verification.json', {'verified_at': datetime.now(timezone.utc).isoformat(), 'main_sha': expected, 'tree_sha': '36b5b134085228aa2d0f0e800d2a4cf6f5c47361', 'ci_run_id': ci['id'], 'pages_run_id': pages['id'], 'built_files': hashes, 'served_files': served, 'official_measurement_started': False})
          print(json.dumps({'main_sha': expected, 'ci': ci['id'], 'pages': pages['id'], 'served_files': len(served)}, indent=2))
          PY
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"
          git bundle create "$RUNNER_TEMP/ci51-final-evidence/source.bundle" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci51-postmerge-verification
          path: ${{ runner.temp }}/ci51-final-evidence/
          retention-days: 7
          if-no-files-found: error
