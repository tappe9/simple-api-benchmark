name: Flask investigation
on:
  push:
    branches: [investigate/flask-json-70]
permissions:
  contents: read
concurrency:
  group: flask-investigation-70
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'tappe9/simple-api-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - name: Diagnostic regression tests
        run: python -m unittest discover -s tests -p test_benchmark_flask_diagnostic.py -v
      - name: Fixed non-publishing hypothesis matrix
        run: python -m benchmark.flask_diagnostic
      - name: Confirm production inputs and published outputs stay unchanged
        run: |
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Export exact source for offline review
        if: always()
        run: |
          mkdir -p .cache/flask-diagnostic/source
          git bundle create .cache/flask-diagnostic/source/source.bundle HEAD
          git rev-parse HEAD HEAD^{tree} > .cache/flask-diagnostic/source/identity.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flask-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/flask-diagnostic/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
