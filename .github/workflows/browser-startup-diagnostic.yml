name: Browser startup diagnostic
on:
  push:
    branches: [ops/browser-startup-58]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'tappe9/simple-api-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/node-fastify/.node-version
      - name: Measure original Chrome startup with isolated profiles and bounded cleanup
        run: |
          python - <<'PY'
          import http.server, json, os, pathlib, shutil, signal, subprocess, tempfile, threading, time, urllib.request
          binary = next(shutil.which(n) for n in ('google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser') if shutil.which(n))
          print('Browser:', binary, 'realpath:', os.path.realpath(binary), flush=True)
          subprocess.run([binary, '--version'], check=True, timeout=20)
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200); self.end_headers(); self.wfile.write(b'<html><body>readiness diagnostic</body></html>')
              def log_message(self, *args): pass
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          try:
              for attempt in range(1, 4):
                  with tempfile.TemporaryDirectory(prefix='sab-chrome-diagnostic-') as directory:
                      profile = pathlib.Path(directory) / 'profile'
                      profile.mkdir()
                      with (pathlib.Path(directory) / 'stderr.log').open('w+') as errors:
                          command = [binary, '--headless=new', '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage', '--remote-debugging-port=0', f'--user-data-dir={profile}', f'http://127.0.0.1:{server.server_port}/']
                          started = time.monotonic()
                          process = subprocess.Popen(command, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=errors, start_new_session=True)
                          ready = False
                          try:
                              while time.monotonic() - started < 60 and process.poll() is None:
                                  port_file = profile / 'DevToolsActivePort'
                                  if port_file.exists():
                                      port = int(port_file.read_text().splitlines()[0])
                                      with urllib.request.urlopen(f'http://127.0.0.1:{port}/json/version', timeout=2) as response:
                                          version = json.load(response)
                                      print(json.dumps({'attempt': attempt, 'ready_seconds': round(time.monotonic()-started, 3), 'browser': version['Browser']}), flush=True)
                                      ready = True
                                      break
                                  time.sleep(0.1)
                              if not ready:
                                  print(json.dumps({'attempt': attempt, 'ready': False, 'elapsed_seconds': round(time.monotonic()-started, 3), 'exit': process.poll()}), flush=True)
                          finally:
                              if process.poll() is None:
                                  os.killpg(process.pid, signal.SIGKILL)
                              process.wait(timeout=5)
                              errors.seek(0)
                              print('Browser stderr tail:', errors.read()[-4000:], flush=True)
                          if not ready:
                              raise SystemExit('Chrome did not become ready within the diagnostic deadline')
          finally:
              server.shutdown(); server.server_close()
          PY
      - name: Run the unchanged full browser assertions
        run: node --test tests/test_dashboard_browser.mjs
