name: Validate Rust integration
on:
  push:
    branches: [finalize/issue-4-rust-actix]
permissions:
  contents: read
concurrency:
  group: validate-rust-integration
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: rust-integration-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.1
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Static checks
        run: |
          set -euo pipefail
          python tests/test_database_environment.py --static
          python tests/test_go_gin_service.py --static
          python tests/test_node_fastify_service.py --static
          python tests/test_python_fastapi_service.py --static
          python tests/test_rust_actix_service.py --static
          python -m compileall -q tests
          git diff --check
      - name: Rust tests and real Docker acceptance
        run: make test-rust-actix
      - name: Shared PostgreSQL regression
        run: make test-db
      - name: Go Gin regression
        run: make test-go-gin
      - name: Node Fastify regression
        run: make test-node-fastify
      - name: Python FastAPI regression
        run: make test-python-fastapi
      - name: Verify scope and source integrity
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --check a553e416251966234c73b5a7adf1facc6913f31b HEAD
          test -z "$(git diff --name-only a553e416251966234c73b5a7adf1facc6913f31b HEAD -- apps/go-gin apps/node-fastify apps/python-fastapi database)"
          test -z "$(git ls-files docs/superpowers .plan scripts benchmark results site)"
          test "$(git ls-files '.github/workflows/*')" = '.github/workflows/validate-rust-integration.yml'
      - name: Final cleanup
        if: always()
        run: |
          set -euo pipefail
          make down
          docker compose ps -a
          test -z "$(docker compose ps -a --quiet)"
          test -z "$(docker network ls --quiet --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          git diff --check
