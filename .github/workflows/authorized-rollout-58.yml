name: Authorized eight-stack rollout
on:
  push:
    branches: [ops/official-eight-stack-rollout-58]
permissions:
  contents: read
  actions: write
concurrency:
  group: authorized-eight-stack-rollout-58
  cancel-in-progress: false
jobs:
  dispatch:
    if: >-
      github.repository == 'tappe9/simple-api-benchmark' &&
      github.ref == 'refs/heads/ops/official-eight-stack-rollout-58' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_MAIN: c8e033ea176366644f5bed5ded12cab79e6fcbeb
      EXPECTED_CI: '34924589999'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: c8e033ea176366644f5bed5ded12cab79e6fcbeb
          fetch-depth: 0
          persist-credentials: false
      - name: Retain the exact approved source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = 9389884db4164633b45151b737fdebd8c2706176
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/rollout-evidence"
          git bundle create "$RUNNER_TEMP/rollout-evidence/measured-source.bundle" HEAD refs/remotes/origin/main
      - name: Verify post-merge gates and submit exactly one official dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.request
          repository = 'tappe9/simple-api-benchmark'
          prefix = f'https://api.github.com/repos/{repository}'
          source = os.environ['EXPECTED_MAIN']
          ci_id = int(os.environ['EXPECTED_CI'])
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rollout-evidence'
          members = ('go-gin', 'go-echo', 'rust-actix', 'rust-axum', 'node-fastify', 'node-express', 'python-fastapi', 'python-flask')
          expected_jobs = {'plan', 'shared', 'smoke', 'required', *(f'implementation ({member})' for member in members)}
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          def api(path, *, data=None):
              request = urllib.request.Request(
                  prefix + path,
                  data=None if data is None else json.dumps(data).encode('utf-8'),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2026-03-10'},
                  method='GET' if data is None else 'POST')
              # No automatic retries, especially for the one authorized POST.
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = response.read()
                  return json.loads(payload) if payload else None
          def verify_main():
              require(api('/git/ref/heads/main')['object']['sha'] == source,
                      'Main changed; refusing to dispatch a different source')
          deadline = time.monotonic() + 15 * 60
          last = None
          while True:
              verify_main()
              run = api(f'/actions/runs/{ci_id}')
              require(run['head_sha'] == source and run['head_branch'] == 'main' and
                      run['event'] == 'push' and run['path'] == '.github/workflows/ci.yml' and
                      run['head_repository']['full_name'] == repository,
                      'Unexpected post-merge CI identity')
              if run['status'] != last:
                  print(f"Post-merge CI {ci_id}: {run['status']}", flush=True)
                  last = run['status']
              if run['status'] == 'completed':
                  require(run['conclusion'] == 'success', 'Post-merge CI did not succeed; no dispatch')
                  break
              require(time.monotonic() < deadline, 'Post-merge CI did not complete within the dispatch gate deadline')
              time.sleep(20)
          jobs_payload = api(f'/actions/runs/{ci_id}/jobs?per_page=100')
          jobs = jobs_payload['jobs']
          require(jobs_payload['total_count'] == len(jobs) == 12 and
                  {job['name'] for job in jobs} == expected_jobs and
                  all(job['status'] == 'completed' and job['conclusion'] == 'success' and
                      job['head_sha'] == source for job in jobs),
                  'Every exact-source required job must succeed before dispatch')
          (output / 'post-merge-ci.json').write_text(json.dumps(run, indent=2))
          (output / 'post-merge-jobs.json').write_text(json.dumps(jobs_payload, indent=2))
          workflow = api('/actions/workflows/benchmark.yml')
          require(workflow['path'] == '.github/workflows/benchmark.yml' and workflow['state'] == 'active',
                  'Unexpected or inactive official workflow')
          previous = api('/actions/workflows/benchmark.yml/runs?per_page=100')['workflow_runs']
          require(not any(run['head_sha'] == source for run in previous),
                  'An official run already exists for this source; refusing a duplicate dispatch')
          require(all(run['status'] == 'completed' for run in previous),
                  'Another official run is active; refusing overlapping rollout')
          before_ids = {run['id'] for run in previous}
          verify_main()
          print(f'Dispatching exactly one official benchmark on main {source}', flush=True)
          receipt = api('/actions/workflows/benchmark.yml/dispatches', data={'ref': 'main'})
          (output / 'dispatch-response.json').write_text(json.dumps(receipt, indent=2))
          official = None
          for _ in range(20):
              if receipt and receipt.get('workflow_run_id'):
                  official = api(f"/actions/runs/{int(receipt['workflow_run_id'])}")
              else:
                  candidates = api('/actions/workflows/benchmark.yml/runs?event=workflow_dispatch&per_page=100')['workflow_runs']
                  matches = [run for run in candidates if run['id'] not in before_ids and run['head_sha'] == source]
                  require(len(matches) <= 1, 'Ambiguous new official runs; do not retry dispatch')
                  official = matches[0] if matches else None
              if official:
                  break
              time.sleep(3)
          require(official is not None, 'Dispatch submitted but run identity not yet available; do not retry POST')
          require(official['head_sha'] == source and official['head_branch'] == 'main' and
                  official['event'] == 'workflow_dispatch' and official['path'] == '.github/workflows/benchmark.yml' and
                  official['head_repository']['full_name'] == repository and official['run_attempt'] == 1,
                  'Official dispatch resolved to an unexpected source or context')
          (output / 'official-run.json').write_text(json.dumps(official, indent=2))
          print(json.dumps({'official_run_id': official['id'], 'source': source,
                            'attempt': official['run_attempt'], 'url': official['html_url']}, indent=2), flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: authorized-rollout-${{ github.run_id }}
          path: ${{ runner.temp }}/rollout-evidence/
          retention-days: 7
          if-no-files-found: error
