name: CI toolchain development evidence
on:
  push:
    branches: [ci/reduce-toolchain-setup-51]
    paths: [.github/workflows/ci-toolchains-development.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3da76bccd66ff56e04ab199ffec2f216f1b4bdc5
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: apps/python-fastapi/.python-version
      - name: Export hash-locked Ruff and baseline job timestamps
        run: |
          mkdir -p "$RUNNER_TEMP/ci51-evidence"
          grep '^ruff==' apps/python-fastapi/requirements-dev.lock > "$RUNNER_TEMP/ruff.lock"
          python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/ruff.lock"
          cp "$(command -v ruff)" "$RUNNER_TEMP/ci51-evidence/ruff"
          ruff --version > "$RUNNER_TEMP/ci51-evidence/tool-version.txt"
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'ci51-evidence'
          for run_id in (34934161057, 34933489429):
              for suffix in ('', '/jobs?per_page=100'):
                  url = f'https://api.github.com/repos/tappe9/simple-api-benchmark/actions/runs/{run_id}{suffix}'
                  request = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'simple-api-benchmark-ci51'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
                  name = 'jobs' if suffix else 'run'
                  (root / f'{run_id}-{name}.json').write_text(json.dumps(data, indent=2))
          PY
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci51-baseline-tooling
          path: ${{ runner.temp }}/ci51-evidence/
          retention-days: 7
          if-no-files-found: error
