[package]
name = "rust-actix"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
actix-web = { version = "=4.15.0", default-features = false, features = ["macros"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-none"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
