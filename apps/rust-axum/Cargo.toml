[package]
name = "rust-axum"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "net", "signal", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-none"] }

[dev-dependencies]
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
