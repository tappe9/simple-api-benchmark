x-database-environment: &database-environment
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: benchmark
  DATABASE_USER: benchmark
  DATABASE_PASSWORD: benchmark

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql:rw,size=512m,mode=1777
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - benchmark
    restart: "no"

networks:
  benchmark:
    driver: bridge
