x-database-environment: &database-environment
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: benchmark
  DATABASE_USER: benchmark
  DATABASE_PASSWORD: benchmark

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host 127.0.0.1 --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql:rw,size=512m,mode=1777
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - benchmark
    restart: "no"

  go-gin:
    build:
      context: ./apps/go-gin
    environment:
      <<: *database-environment
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - /go-gin
        - healthcheck
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    cpus: 1.0
    mem_limit: 512m
    networks:
      - benchmark
    restart: "no"

  node-fastify:
    build:
      context: ./apps/node-fastify
    environment:
      <<: *database-environment
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - src/healthcheck.js
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    cpus: 1.0
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - benchmark
    restart: "no"

  python-fastapi:
    build:
      context: ./apps/python-fastapi
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - benchmark_api.healthcheck
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    cpus: 1.0
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - benchmark
    restart: "no"

  rust-actix:
    build:
      context: ./apps/rust-actix
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/rust-actix
        - healthcheck
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    cpus: 1.0
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - benchmark
    restart: "no"

networks:
  benchmark:
    driver: bridge
